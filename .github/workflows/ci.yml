# Runs on GitHub (darwish-dev/nuzm). The `deploy` workflow starts after this one succeeds on main.
name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm audit --prod --audit-level=high
  # Integration and browser checks use an explicit, disposable runner-local database.
  full:
    needs: verify
    # pinned: `ubuntu-latest` moved to a release without the postgresql-16 package
    runs-on: ubuntu-24.04
    env:
      CI: 'true'
      NUZM_TEST_DB_POLICY: ci
      NUZM_PGBIN: /usr/lib/postgresql/16/bin
      NUZM_PGPORT: '55432'
      E2E_PG_PORT: '55432'
      NUZM_TEST_ADMIN_URL: postgres://nuzm_admin@127.0.0.1:55432/postgres
      DATABASE_ADMIN_URL: postgres://nuzm_admin@127.0.0.1:55432/nuzm_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16 redis-server
      - run: pnpm install --frozen-lockfile
      - run: pnpm services:start
      - run: /usr/lib/postgresql/16/bin/createdb -h 127.0.0.1 -p "$NUZM_PGPORT" -U nuzm_admin nuzm_ci
      - run: pnpm --filter @nuzm/e2e exec playwright install --with-deps chromium
      - run: pnpm verify:full:isolated
      - if: always()
        run: pnpm services:stop
