<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nuzm</title>
    <link rel="stylesheet" href="offline.css" />
  </head>
  <body>
    <main class="card" aria-labelledby="title">
      <img class="mark" src="mark.png" alt="" width="72" height="57" />
      <h1 id="title" data-t="title"></h1>
      <p data-t="body"></p>
      <p class="origin" dir="ltr" id="origin"></p>
      <div class="actions">
        <button type="button" id="retry" data-t="retry"></button>
        <button type="button" id="lang" class="secondary"></button>
      </div>
      <p class="status" role="status" aria-live="polite" id="status"></p>
    </main>
    <script src="offline.js"></script>
  </body>
</html>
