name: nuzm_app
description: "Nuzm mobile app: Nuzm AI builder and the customer console."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.3.4
  http: ^1.6.0
  intl: ^0.20.2
  lucide_icons_flutter: ^4.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  # Cairo (SIL OFL 1.1, assets/fonts/Cairo-OFL.txt): the console's font, bundled so Arabic renders offline.
  # Static instances cut from google/fonts ofl/cairo Cairo[slnt,wght].ttf at slnt=0.
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800

# App icon: the Nuzm mark on the console's dark surface (#0B0B0C). Regenerate with
# `dart run flutter_launcher_icons` after changing assets/icon/.
flutter_launcher_icons:
  image_path: assets/icon/app-icon.png
  android: true
  adaptive_icon_background: "#0B0B0C"
  adaptive_icon_foreground: assets/icon/app-icon-foreground.png
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/icon/app-icon.png
    background_color: "#0B0B0C"
    theme_color: "#0B0B0C"
