paths:
  /v1/admin/knowledge/uploads:
    post:
      operationId: createKnowledgeUpload
      tags:
        - admin
      summary: Open a resumable upload session
      description: Body {name, resourceType, declaredBytes, sha256, filename}. Returns the session with `partSize` and the parts already received,
        so an interrupted upload resumes. State `UPLOADING`; the object is quarantined until completion. Quotas and size limits come from
        the settings. Permission `admin:ai_knowledge:manage`.
      x-nuzm-platform-permission: admin:ai_knowledge:manage
      x-nuzm-realm: admin
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeUploadInput"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeUpload"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/admin/knowledge/uploads/{uploadId}:
    get:
      operationId: getKnowledgeUpload
      tags:
        - admin
      summary: Read an upload session
      description: State, bytes received and parts received (for resuming).
      x-nuzm-platform-permission: admin:ai_knowledge:read
      x-nuzm-realm: admin
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: uploadId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeUpload"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: cancelKnowledgeUpload
      tags:
        - admin
      summary: Cancel an upload
      description: "Deletes the quarantined parts. A completed upload cannot be cancelled: use disable or archive."
      x-nuzm-platform-permission: admin:ai_knowledge:manage
      x-nuzm-realm: admin
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: uploadId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Success
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/admin/knowledge/uploads/{uploadId}/parts/{partNumber}:
    put:
      operationId: putKnowledgeUploadPart
      tags:
        - admin
      summary: Upload one part
      description: Raw bytes of one part; `X-Part-Sha256` is required and verified; re-sending the same part is idempotent. Permission
        `admin:ai_knowledge:manage`.
      x-nuzm-platform-permission: admin:ai_knowledge:manage
      x-nuzm-realm: admin
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: uploadId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: partNumber
          in: path
          required: true
          schema:
            type: integer
        - name: X-Part-Sha256
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeUpload"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/admin/knowledge/uploads/{uploadId}/completion:
    post:
      operationId: completeKnowledgeUpload
      tags:
        - admin
      summary: Complete an upload and start ingestion
      description: "Verifies the whole-object SHA-256 and the part list, creates the resource (or a new version of `resourceId`) and enqueues
