      x-nuzm-platform-permission: admin:ai_knowledge:read
      x-nuzm-realm: admin
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSettings"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateKnowledgeSettings
      tags:
        - admin
      summary: Change engine settings
      description: "`If-Match` required. Weights must sum to 100; limits cannot exceed the platform hard caps. Audited with before/after."
      x-nuzm-platform-permission: admin:ai_knowledge:publish
      x-nuzm-realm: admin
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeSettingsPatch"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSettings"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/builder/templates:
    get:
      operationId: listBuilderTemplates
      tags:
        - builder
      summary: Browse templates and themes
      description: "Published platform templates plus the organization's own. Filters: `kind` (website, dashboard, saas, mobile, flutter,
        full-stack, e-commerce, landing), `framework`, `q`. Returns metadata, compatibility facts, Design DNA summary and preview image
        references only — never source files. Flag `knowledge.customer_templates`; 404 when off."
      x-nuzm-permission: builder:read
      x-nuzm-org-scoped: true
      security:
        - sessionCookie: []
          csrfHeader: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/OrgHeader"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: kind
          in: query
          required: false
          schema:
            type: string
        - name: framework
          in: query
          required: false
          schema:
            type: string
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTemplatePage"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/builder/templates/{id}:
    get:
      operationId: getBuilderTemplate
      tags:
        - builder
      summary: Get a template
      description: Compatibility details, supported adaptation modes, editable areas, preview assets. A template that is not published, not
        eligible or not the organization's is 404.
      x-nuzm-permission: builder:read
      x-nuzm-org-scoped: true
      security:
        - sessionCookie: []
          csrfHeader: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/OrgHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTemplate"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/builder/template-recommendations:
    post:
      operationId: recommendBuilderTemplates
      tags:
        - builder
      summary: Recommend starting points for a description
      description: "Body {description, platform?, frameworkPreference?, locale?}. Hard filters first, then the configured weighted ranking; each
        result carries relevance, compatibility, quality, licence eligibility, matching components, evidence and a usage strategy. No
        private resource content is returned. Deterministic: no model call unless the organization enabled AI processing and policy allows
        it."
      x-nuzm-permission: builder:read
      x-nuzm-org-scoped: true
      security:
        - sessionCookie: []
          csrfHeader: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/OrgHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateRecommendationInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateRecommendationResult"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/builder/projects/from-template:
    post:
      operationId: createBuilderProjectFromTemplate
      tags:
        - builder
      summary: Create a project from a template version
      description: "Body {templateId, versionId?, name, adaptationMode: STRICT|ADAPTIVE|CREATIVE (default ADAPTIVE), direction: rtl|ltr, colors?,
        typography?}. Copies the pinned immutable version into the project's own files (the template is never modified) and records
        `knowledge.generation_resource_links`. 201."
      x-nuzm-permission: builder:write
      x-nuzm-org-scoped: true
      security:
        - sessionCookie: []
          csrfHeader: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/OrgHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FromTemplateInput"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderProjectDetail"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/builder/projects/imports:
    post:
      operationId: importBuilderProject
      tags:
        - builder
      summary: Import an existing project
      description: "Body {source: github|upload, installationId?, repository?, uploadId?, name}. The import is a tenant project: it is isolated
        from the platform library and has no write path into it. GitHub uses the org's AI Studio connection; no token is accepted. Flag
        `knowledge.import_projects`."
      x-nuzm-permission: builder:write
      x-nuzm-org-scoped: true
      security:
        - sessionCookie: []
          csrfHeader: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/OrgHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectImportInput"
      responses:
        "202":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderProjectDetail"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/builder/generation-plans:
    post:
      operationId: createGenerationPlan
      tags:
        - builder
      summary: Plan a generation from requirements
      description: "Body {projectId, prompt, templateId?, selectionStrategy: AUTO_SELECT|USER_SELECTED|ADMIN_DEFAULT|GENERATE_FROM_SCRATCH,
        adaptationMode?}. Returns the structured plan (requirements, chosen resource versions with reasons or the incompatibility
        explanation, files to change, migrations, tests). The plan is stored; execution is `POST /v1/ai/runs` with `kind:
        knowledge-generation` and `planId` (budgets, credits, metering and cancellation are the run engine's)."
      x-nuzm-permission: ai:write
      x-nuzm-org-scoped: true
      security:
        - sessionCookie: []
          csrfHeader: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/OrgHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerationPlanInput"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationPlan"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/builder/generation-plans/{id}:
    get:
      operationId: getGenerationPlan
      tags:
        - builder
      summary: Get a plan
      description: Plan, selection explanation and, once run, its evaluation summary.
      x-nuzm-permission: ai:read
      x-nuzm-org-scoped: true
      security:
        - sessionCookie: []
          csrfHeader: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/OrgHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationPlan"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
components:
  schemas:
    KnowledgeUploadInput:
      type: object
      required:
        - name
        - resourceType
        - declaredBytes
        - sha256
        - filename
      properties:
        name:
          type: string
        resourceType:
          type: string
          enum:
            - PROJECT
            - THEME
            - COMPONENT_LIBRARY
            - DESIGN_SYSTEM
            - DOCUMENTATION
            - API_SPECIFICATION
            - DATABASE_SCHEMA
            - STARTER_KIT
            - REUSABLE_MODULE
        declaredBytes:
          type: integer
        sha256:
          type: string
        filename:
          type: string
        resourceId:
          type: string
          format: uuid
    KnowledgeUpload:
      type: object
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum:
            - OPEN
            - COMPLETED
            - CANCELLED
            - EXPIRED
        declaredBytes:
          type: integer
        receivedBytes:
          type: integer
        partSize:
          type: integer
        partsReceived:
          type: array
          items:
            type: integer
        expiresAt:
          type: string
          format: date-time
    KnowledgeUploadCompletion:
      type: object
      required:
        - parts
        - metadata
      properties:
        parts:
          type: array
          items:
            type: object
            properties:
              partNumber:
                type: integer
              sha256:
                type: string
        resourceId:
          type: string
          format: uuid
        metadata:
          $ref: "#/components/schemas/KnowledgeMetadata"
    KnowledgeMetadata:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        resourceType:
          type: string
          enum:
            - PROJECT
            - THEME
            - COMPONENT_LIBRARY
            - DESIGN_SYSTEM
            - DOCUMENTATION
            - API_SPECIFICATION
            - DATABASE_SCHEMA
            - STARTER_KIT
            - REUSABLE_MODULE
        platform:
          type: string
          enum:
            - WEB
            - MOBILE
            - BACKEND
            - FULL_STACK
            - CROSS_PLATFORM
        frameworks:
          type: array
          items:
            type: string
        languages:
          type: array
          items:
            type: string
        category:
          type: string
        version:
          type: string
        tags:
          type: array
          items:
            type: string
        license:
          type: string
        source:
          type: string
        visibility:
          type: string
          enum:
            - PLATFORM_PRIVATE
            - PLATFORM_PUBLISHED
        reusePermissions:
          $ref: "#/components/schemas/KnowledgePermissions"
        defaultEligible:
          type: boolean
        processingPriority:
          type: string
          enum:
            - LOW
            - NORMAL
            - HIGH
        dataRegion:
          type: string
    KnowledgePermissions:
      type: object
      properties:
        reuseScope:
          type: string
          enum:
            - NONE
            - ARCHITECTURE_ONLY
            - COMPONENTS
            - FULL_STARTER
        aiProcessing:
          type: boolean
        componentReuse:
          type: boolean
        starterEligible:
          type: boolean
        architectureReference:
          type: boolean
        licenseSpdx:
          type: string
        licenseVerdict:
          type: string
          enum:
            - ALLOWED
            - RESTRICTED
            - UNKNOWN
            - BLOCKED
    KnowledgeGithubImportInput:
      type: object
      required:
        - installationId
        - repository
        - ref
        - resourceType
      properties:
        installationId:
          type: string
        repository:
          type: string
        ref:
          type: string
        resourceType:
          type: string
          enum:
            - PROJECT
            - THEME
            - COMPONENT_LIBRARY
            - DESIGN_SYSTEM
            - DOCUMENTATION
            - API_SPECIFICATION
            - DATABASE_SCHEMA
            - STARTER_KIT
            - REUSABLE_MODULE
        name:
          type: string
    KnowledgeResource:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        resourceType:
          type: string
          enum:
            - PROJECT
            - THEME
            - COMPONENT_LIBRARY
            - DESIGN_SYSTEM
            - DOCUMENTATION
            - API_SPECIFICATION
            - DATABASE_SCHEMA
            - STARTER_KIT
            - REUSABLE_MODULE
        platform:
          type: string
          enum:
            - WEB
            - MOBILE
            - BACKEND
            - FULL_STACK
            - CROSS_PLATFORM
        frameworks:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
            - UPLOADING
            - QUARANTINED
            - VALIDATING
            - ANALYZING
            - INDEXING
            - AWAITING_REVIEW
            - ACTIVE
            - FAILED
            - DISABLED
            - ARCHIVED
        currentVersionId:
          type: string
          format: uuid
        visibility:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
    KnowledgeResourcePage:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeResource"
        nextCursor:
          type: string
          nullable: true
    KnowledgeResourceDetail:
      allOf:
        - $ref: "#/components/schemas/KnowledgeResource"
        - type: object
          properties:
            metadata:
              $ref: "#/components/schemas/KnowledgeMetadata"
            permissions:
              $ref: "#/components/schemas/KnowledgePermissions"
            manifest:
              $ref: "#/components/schemas/KnowledgeManifestSummary"
            quality:
              type: array
              items:
                $ref: "#/components/schemas/KnowledgeQualityScore"
            componentCount:
              type: integer
            jobs:
              type: array
              items:
                $ref: "#/components/schemas/KnowledgeJob"
    KnowledgeResourcePatch:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        frameworks:
          type: array
          items:
            type: string
        platform:
          type: string
          enum:
            - WEB
            - MOBILE
            - BACKEND
            - FULL_STACK
            - CROSS_PLATFORM
        license:
          type: string
        visibility:
          type: string
        defaultEligible:
          type: boolean
        permissions:
          $ref: "#/components/schemas/KnowledgePermissions"
    KnowledgeActionInput:
      type: object
      properties:
        versionId:
          type: string
          format: uuid
        note:
          type: string
        reason:
          type: string
        force:
          type: boolean
        decision:
          type: string
          enum:
            - approve
            - reject
    KnowledgeJobRef:
      type: object
      properties:
        jobId:
          type: string
          format: uuid
        operationId:
          type: string
          format: uuid
        state:
          type: string
    KnowledgeManifestSummary:
      type: object
      properties:
        schemaVersion:
          type: string
        frameworks:
          type: array
          items:
            type: string
        languages:
          type: array
          items:
            type: string
        capabilities:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              confidence:
                type: number
              evidence:
                type: array
                items:
                  type: object
                  properties:
                    path:
                      type: string
                    line:
                      type: integer
        modules:
          type: array
          items:
            type: string
        components:
          type: array
          items:
            type: string
    KnowledgeQualityScore:
      type: object
      properties:
        dimension:
          type: string
          enum:
            - BUILD
            - TEST
            - ARCHITECTURE
            - DESIGN
            - SECURITY
            - COMPLETENESS
        score:
          type: number
        method:
          type: string
        evidenceRef:
          type: string
        measured:
          type: boolean
    KnowledgeVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        seq:
          type: integer
        semver:
          type: string
        state:
          type: string
          enum:
            - UPLOADING
            - QUARANTINED
            - VALIDATING
            - ANALYZING
            - INDEXING
            - AWAITING_REVIEW
            - ACTIVE
            - FAILED
            - DISABLED
            - ARCHIVED
        checksumSha256:
          type: string
        bytes:
          type: integer
        sourceCommit:
          type: string
        licenseVerdict:
          type: string
        createdAt:
          type: string
          format: date-time
        activatedAt:
          type: string
          format: date-time
    KnowledgeVersionPage:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeVersion"
        nextCursor:
          type: string
          nullable: true
    KnowledgeComponent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
        framework:
          type: string
        path:
          type: string
        props:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              type:
                type: string
              required:
                type: boolean
        dependencies:
          type: array
          items:
            type: string
        platforms:
          type: array
          items:
            type: string
        reuseAllowed:
          type: boolean
        qualityScore:
          type: number
        previewRef:
          type: string
    KnowledgeComponentPage:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeComponent"
        nextCursor:
          type: string
          nullable: true
    KnowledgeJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        state:
          type: string
          enum:
            - QUEUED
            - RUNNING
            - SUCCEEDED
            - FAILED
            - CANCELLED
            - DEAD_LETTER
        attempt:
          type: integer
        progress:
          type: number
        errorCode:
          type: string
        errorDetail:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
    KnowledgeJobPage:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeJob"
        nextCursor:
          type: string
          nullable: true
    KnowledgeDefaultInput:
      type: object
      required:
        - platform
        - resourceId
      properties:
        platform:
          type: string
          enum:
            - WEB
            - MOBILE
            - BACKEND
            - FULL_STACK
            - CROSS_PLATFORM
        framework:
          type: string
        category:
          type: string
        plan:
          type: string
        mode:
          type: string
          enum:
            - STRICT
            - ADAPTIVE
            - CREATIVE
        resourceId:
          type: string
          format: uuid
        versionPin:
          type: string
          format: uuid
    KnowledgeDefaultPage:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeDefaultInput"
        nextCursor:
          type: string
          nullable: true
    KnowledgeAnalytics:
      type: object
      properties:
        totals:
          type: object
          properties:
            resources:
              type: integer
            analyzedProjects:
              type: integer
            activeThemes:
              type: integer
            indexedComponents:
              type: integer
            documentation:
              type: integer
            awaitingProcessing:
              type: integer
            failedJobs:
              type: integer
            storageBytes:
              type: integer
        retrieval:
          type: object
          properties:
            queries:
              type: integer
            hitRate:
              type: number
              nullable: true
        generation:
          type: object
          properties:
            selectionsByResource:
              type: array
              items:
                type: object
                properties:
                  resourceId:
                    type: string
                    format: uuid
                  count:
                    type: integer
            successRate:
              type: number
              nullable: true
            buildSuccessRate:
              type: number
              nullable: true
            avgDurationMs:
              type: integer
              nullable: true
        cost:
          type: object
          properties:
            currency:
              type: string
            estimatedMinor:
              type: integer
            actualMinor:
              type: integer
            byProvider:
              type: array
              items:
                type: object
                properties:
                  provider:
                    type: string
                  actualMinor:
                    type: integer
    KnowledgeSettings:
      type: object
      properties:
        rankingWeights:
          type: object
          properties:
            functional:
              type: number
            framework:
              type: number
            architecture:
              type: number
            design:
              type: number
            quality:
              type: number
            reuse:
              type: number
        ingestion:
          type: object
          properties:
            maxEntries:
              type: integer
            maxExtractedBytes:
              type: integer
            maxCompressionRatio:
              type: number
            maxDepth:
              type: integer
            maxUploadBytes:
              type: integer
        quotas:
          type: object
          properties:
            storageBytesPerOrg:
              type: integer
            concurrentJobs:
              type: integer
        retentionDays:
          type: integer
        version:
          type: integer
    KnowledgeSettingsPatch:
      type: object
      properties:
        rankingWeights:
          type: object
        ingestion:
          type: object
        quotas:
          type: object
        retentionDays:
          type: integer
    BuilderTemplate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
        platform:
          type: string
          enum:
            - WEB
            - MOBILE
            - BACKEND
            - FULL_STACK
            - CROSS_PLATFORM
        frameworks:
          type: array
          items:
            type: string
        description:
          type: string
        designDna:
          type: object
          properties:
            style:
              type: string
            layout:
              type: string
            density:
              type: string
