# SCR-K-01 — proposed spec/db/ownership.yaml delta (DRAFT). Not merged; run `pnpm compliance:classification-coverage` after the K1 migrations
schemas:
  knowledge:
    owner_module: knowledge
    created_by: K
    extended_by: []
    tables:
      - analysis_results
      - generation_evaluations
      - generation_plans
      - generation_resource_links
      - processing_jobs
      - quality_scores
      - resource_components
      - resource_dependencies
      - resource_files
      - resource_manifests
      - resource_permissions
      - resource_relationships
      - resource_search_documents
      - resource_versions
      - resources
      - template_defaults
      - theme_tokens
      - theme_variants
      - uploads
      - usage_events
tenant_less:
  - knowledge.analysis_results
  - knowledge.processing_jobs
  - knowledge.quality_scores
  - knowledge.resource_components
  - knowledge.resource_dependencies
  - knowledge.resource_files
  - knowledge.resource_manifests
  - knowledge.resource_permissions
  - knowledge.resource_relationships
  - knowledge.resource_search_documents
  - knowledge.resource_versions
  - knowledge.resources
  - knowledge.template_defaults
  - knowledge.theme_tokens
  - knowledge.theme_variants
  - knowledge.uploads
  - knowledge.usage_events
tenant_less_note: knowledge.* rows with org_id NULL are the platform library (staff-owned); org_id set = a customer's private template or
  import. Customers read platform rows only through the view knowledge.v_published_templates (metadata and previews, never files or object
  keys). generation_plans, generation_resource_links and generation_evaluations are strictly tenant-owned (org_id NOT NULL, ordinary RLS
  key); template_defaults is platform-only (no org_id).
migration_ranges:
  K: 1860-1899
