    where: Transactional email content and recipients sent to the email vendor
    data_classes:
      - personal
    processor_kind: transactional-email
    enforcement: enforced
    flag: residency.enforce.email
    call_site: apps/api/src/modules/email/internal/message.service.ts
  - id: m08-mailbox
    milestone: M08
    where: Mailbox provisioning and mailbox data placement
    data_classes:
      - personal
      - customer-content
    processor_kind: mailbox
    enforcement: enforced
    flag: residency.enforce.mailbox
    call_site: apps/api/src/modules/email/internal/mailbox.service.ts
  - id: m09-model-gateway
    milestone: M09
    where: 'Model gateway: prompt and output class against the model region and processor'
    data_classes:
      - customer-content
      - personal
    processor_kind: model
    enforcement: enforced
    flag: residency.enforce.model
    call_site: apps/api/src/modules/ai/internal/gateway.service.ts
  - id: m09-builder-assets
    milestone: M09
    where: Builder asset storage
    data_classes:
      - customer-content
    enforcement: enforced
    flag: residency.enforce.builder
