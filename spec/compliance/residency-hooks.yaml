    enforcement: listed
    flag: residency.enforce.audit_archive
    call_site: null
  - id: m10-sandbox-builds
    milestone: M10
    where: Sandbox node region, builds and test runs (Git has no remote); build workers of M10B (including a macOS build vendor) are listed there
    data_classes:
      - customer-content
      - credentials
    enforcement: enforced
    flag: residency.enforce.builds
    call_site: apps/api/src/modules/appbuilder/internal/sandbox/sandbox.service.ts
  - id: m10-source-export
    milestone: M10
    where: 'Source exports: the destination region of the archive and its signed URL'
    data_classes:
      - customer-content
    enforcement: enforced
    flag: residency.enforce.export
    call_site: apps/api/src/modules/appbuilder/internal/export/export.service.ts
  - id: m10-app-deployment
    milestone: M10
    where: Deployment of a generated app to a hosting site or compute instance in a region
    data_classes:
      - customer-content
    enforcement: enforced
    flag: residency.enforce.deployment
    call_site: apps/api/src/modules/appbuilder/internal/deploy/deployment.service.ts
  - id: m10-agent-runs
    milestone: M10
    where: 'Agent runs: prompts, structured outputs and run records in the project region; model routing is the M09 gateway hook'
    data_classes:
      - customer-content
    processor_kind: model
    enforcement: listed
    flag: residency.enforce.agent_runs
    call_site: null
