      milestone: M05,
      where: 'Snapshot and backup destinations',
      data_classes: [customer-content, credentials],
      processor_kind: compute,
      enforcement: listed,
      flag: residency.enforce.backups,
      call_site: null,
    }
  - {
      id: m06-node-selection,
      milestone: M06,
      where: 'Hosting node selection by region; site backup destinations',
      data_classes: [customer-content, personal],
      processor_kind: hosting,
