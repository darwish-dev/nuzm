    where: Marketplace purchase (listing region against the buyer policy) and install (copy of an artifact into the buyer organization)
    data_classes:
      - customer-content
    enforcement: enforced
    flag: residency.enforce.marketplace
    call_site: apps/api/src/modules/marketplace/internal/install.service.ts
  - id: m12-audit-archive
    milestone: M12
    where: Audit-log archive and backup placement (audit retention)
