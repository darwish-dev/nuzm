# Residency enforcement-hook registry (M04 S14a, docs/10 §3 "Enforcement points"; AC-M04-14).
# Every module that places data, calls a vendor or a model MUST ask the residency service first (`assertResidency()` / `@RequiresResidency`, packages/domain).
# This file lists EVERY required call site with its owner milestone. Status per hook:
#   listed   = required, not built yet (the owner milestone builds it); NOT enforced, so nothing breaks before the feature exists
#   enforced = built: `call_site` must name a source file that really calls assertResidency/RequiresResidency (the CI check reads the file)
#   exempt   = regulator-mandated or internal: needs an `exempt_reason`; the decision is still LOGGED by the module
# A hook is enabled for a feature only when its `flag` is on; an owner milestone must move its hooks to `enforced` before that flag goes on.
# CI: `pnpm compliance:residency-hooks` (every table with a data_region column is listed; every adapter kind of docs/09 has a hook; M05..M12 each have hooks).
version: 1
status: PROPOSAL
tables:
  # every table with a data_region column and the milestone that must route writes through a hook
  invoicing.invoices:
    {
      owner: M03,
      hook: m03-invoice-archive,
      note: 'issued invoices are tax documents: archive placement is decided with D-34/D-15',
    }
  invoicing.credit_notes: { owner: M03, hook: m03-invoice-archive, note: 'same as invoices' }
  invoicing.zatca_documents:
    { owner: M03, hook: m03-zatca-submission, note: 'regulator-mandated flow: exempt, logged' }
  metering.usage_events:
    {
      owner: M05,
      hook: m05-provisioning,
      note: 'usage carries the placeholder tag sa-pending until M05 supplies verified regions',
    }
  metering.usage_aggregates:
    { owner: M05, hook: m05-provisioning, note: 'derived from usage events' }
  domains.domains:
    {
      owner: M07,
      hook: m07-registrant-contacts,
      note: 'the domain record names where the registrar processes registrant data (providerRegionId); contacts are residency-checked before they leave',
    }
  domains.registrar_accounts:
    {
      owner: M07,
      hook: m07-registrant-contacts,
      note: 'a registrar account declares the country where it processes registrant data; every order evaluates it',
    }
  tenancy.environments:
    { owner: M05, hook: m05-provisioning, note: 'an environment names where its resources run' }
  cloud.resources:
    {
      owner: M05,
      hook: m05-provisioning,
      note: 'generic resource inventory; data_region of the verified region group',
    }
  compute.instances:
    {
      owner: M05,
      hook: m05-provisioning,
      note: 'placement is evaluated at the offer, the quote and again at provisioning',
    }
  compute.instance_intervals:
    { owner: M05, hook: m05-provisioning, note: 'running intervals inherit the instance region' }
  compute.snapshots:
    {
      owner: M05,
      hook: m05-backups,
      note: 'snapshots inherit the instance region; destination hook listed for S23',
    }
  data.database_instances:
    {
      owner: M08,
      hook: m08-data-placement,
      note: 'placement is evaluated at quote, create, restore, backup and rotation (database-flow.ts, pricers.ts)',
    }
  data.database_backups:
    {
      owner: M08,
      hook: m08-data-placement,
      note: 'a backup stays in the data_region of its instance; evaluated before every backup',
    }
  data.storage_buckets:
    {
      owner: M08,
      hook: m08-object-storage,
      note: 'placement is evaluated at quote, create and every execution (storage.service.ts, storage-flow.ts, storage-pricer.ts); system buckets stay in the data_region of the databases they protect',
    }
  email.email_domains:
    {
      owner: M08,
      hook: m08-mailbox,
      note: 'the processing region of the mailbox/transactional provider is evaluated when a domain is added (domain.service.ts)',
    }
  email.mailboxes:
    {
      owner: M08,
      hook: m08-mailbox,
      note: 'mailbox provisioning is evaluated before the provider is called (mailbox.service.ts)',
    }
  email.messages:
    {
      owner: M08,
      hook: m08-transactional-email,
      note: 'recipients and content are personal data: evaluated before every send (message.service.ts)',
    }
  data.database_restores:
    {
      owner: M08,
      hook: m08-data-placement,
      note: 'a restore stays in the source region; evaluated at request and execution',
    }

  hosting.nodes:
    {
      owner: M06,
      hook: m06-node-selection,
      note: 'a node carries the data_region of its compute instance; sites are placed only on nodes in an allowed region',
    }
  hosting.site_backups:
    {
      owner: M06,
      hook: m06-backup-sink,
      note: 'a backup stays in the region of its site; the sink region is evaluated before the archive is stored',
    }
  hosting.sites:
    {
      owner: M06,
      hook: m06-node-selection,
      note: 'a site is placed only on a node whose data_region the residency service allows',
    }
  # >>> M11 tables (appended): control-plane records of automation and the marketplace carry the organization's data_region ('sa-pending' until M05 supplies verified regions)
  automation.workflows:
    {
      owner: M11,
      hook: m11-connectors,
      note: 'workflow definitions are customer content; the region is the organization default (sa-pending until M05)',
    }
  automation.executions:
    {
      owner: M11,
      hook: m11-connectors,
      note: 'execution inputs and step data inherit the workflow region',
    }
  automation.connectors:
    {
      owner: M11,
      hook: m11-connectors,
      note: 'a connector names the declared region of its target host; every call is evaluated by the residency hook before it leaves',
    }
  automation.webhook_endpoints:
    {
      owner: M11,
      hook: m11-connectors,
      note: 'outbound webhooks carry event payloads to a tenant-chosen URL',
    }
  marketplace.listings:
    {
      owner: M11,
      hook: m11-marketplace,
      note: 'the region where the listing artifacts live; purchase and install evaluate it against the buyer policy (fail closed)',
    }
  # <<< M11 tables
  # >>> M09 tables
  ai.sessions:
    {
      owner: M09,
      hook: m09-model-gateway,
      note: 'a session carries the data_region of the organization; prompts leave only through the gateway',
    }
  ai.messages:
    {
      owner: M09,
      hook: m09-model-gateway,
      note: 'message content is stored sealed in the session region and sent to a model only after the residency check',
    }
  ai.runs:
    {
      owner: M09,
      hook: m09-model-gateway,
      note: 'every run carries data_region; every model call of the run evaluates residency first',
    }
  ai.artifacts:
    { owner: M09, hook: m09-model-gateway, note: 'generated artifacts stay in the run region' }
  ai.model_usage:
    {
      owner: M09,
      hook: m09-model-gateway,
      note: 'every call records the provider region and the residency evidence reference',
    }
  builder.projects:
    {
      owner: M09,
      hook: m09-builder-assets,
      note: 'a project carries the data_region its files and versions are stored in',
    }
  builder.form_submissions:
    {
      owner: M09,
      hook: m09-builder-assets,
      note: 'submissions (personal) are stored sealed in the project region',
    }
  deploy.builds:
    { owner: M09, hook: m09-builder-assets, note: 'build artifacts stay in the project region' }
  deploy.deployments:
    {
      owner: M09,
      hook: m09-builder-assets,
      note: 'a deployment publishes only to a hosting site in an allowed region (hosting placement is M06 m06-node-selection)',
    }
  ai.run_steps:
    owner: M10
    hook: m10-agent-runs
    note: run steps carry the data_region of their run; every model call of a run goes through the M09 gateway (RealModelGateway -> GatewayService.invoke), which evaluates residency before the call (hook m09-model-gateway, enforced); the run-record placement itself stays LISTED
  ai.tool_calls:
    owner: M10
    hook: m10-agent-runs
    note: redacted tool-call summaries inherit the region of their run
  ai.approval_requests:
    owner: M10
    hook: m10-agent-runs
    note: an approval names the region of the action it is bound to
  ai.evaluations:
    owner: M10
    hook: m10-agent-runs
    note: evaluation scores inherit the region of the run they scored
  builder.app_specs:
    owner: M10
    hook: m10-agent-runs
    note: a spec is customer content stored in the region of its project
  builder.sandboxes:
    owner: M10
    hook: m10-sandbox-builds
    note: the node region of the sandbox pool is evaluated before placement (sandbox.service.ts create)
  builder.git_repos:
    owner: M10
    hook: m10-sandbox-builds
    note: the repository stays in the region of its project; there is no Git remote
  builder.test_runs:
    owner: M10
    hook: m10-sandbox-builds
    note: tests run in a sandbox placed under the sandbox hook
  builder.exports:
    owner: M10
    hook: m10-source-export
    note: the export destination region is evaluated before the archive is built (export.service.ts)
  deploy.app_deployments:
    owner: M10
    hook: m10-app-deployment
    note: the target region is evaluated before anything is built or deployed (deployment.service.ts create)
  deploy.app_deployment_logs:
    owner: M10
    hook: m10-app-deployment
    note: logs inherit the region of their deployment
  # <<< M09 tables
hooks:
  - id: m03-psp-personal-data
    milestone: M03
    where: Before sending personal or financial data to the payment provider (PspAdapter calls)
    data_classes:
      - personal
      - financial
    processor_kind: psp
    enforcement: listed
    flag: residency.enforce.psp
    call_site: null
  - id: m03-zatca-submission
    milestone: M03
    where: 'ZATCA submissions are regulator-mandated: logged, not blocked'
    data_classes:
      - financial
      - personal
    processor_kind: einvoice
    enforcement: exempt
    exempt_reason: regulator-mandated transfer (class regulatory); the decision is logged by the submission service
    flag: residency.enforce.zatca
    call_site: null
  - id: m03-invoice-archive
    milestone: M03
    where: Placement of issued invoice archives and PDFs
    data_classes:
      - financial
      - personal
    enforcement: listed
    flag: residency.enforce.invoice_archive
    call_site: null
  - id: m05-offers-quote
    milestone: M05
    where: 'Offer filtering and quotes: only regions the organization policy allows'
    data_classes:
      - customer-content
      - personal
    processor_kind: compute
    enforcement: enforced
    flag: residency.enforce.offers
    call_site: apps/api/src/modules/cloud/internal/compute-pricer.ts
  - id: m05-provisioning
    milestone: M05
    where: 'Routing and provisioning: dataRegion of every resource'
    data_classes:
      - customer-content
      - personal
      - credentials
    processor_kind: compute
    enforcement: enforced
    flag: residency.enforce.provisioning
    call_site: apps/api/src/modules/cloud/internal/provisioning.service.ts
  - id: m05-backups
    milestone: M05
    where: Snapshot and backup destinations
    data_classes:
      - customer-content
      - credentials
    processor_kind: compute
    enforcement: listed
    flag: residency.enforce.backups
    call_site: null
  - id: m06-node-selection
    milestone: M06
    where: Hosting node selection by region (PlansService.eligibleRegions asks the residency service for every candidate region before a site is placed)
    data_classes:
      - customer-content
      - personal
    processor_kind: hosting
    enforcement: enforced
    flag: residency.enforce.hosting
    call_site: apps/api/src/modules/hosting/internal/plans.service.ts
  - id: m06-backup-sink
    milestone: M06
    where: Site backup destination (BackupService asks the residency service before a backup is stored; the sink region equals the site data_region)
    data_classes:
      - customer-content
      - personal
      - credentials
    processor_kind: hosting
    enforcement: enforced
    flag: residency.enforce.hosting_backup
    call_site: apps/api/src/modules/hosting/internal/backups.service.ts
  - id: m07-registrant-contacts
    milestone: M07
    where: Registrant contact data sent to registrars (processor evaluation)
    data_classes:
      - personal
    processor_kind: registrar
    enforcement: enforced
    flag: residency.enforce.registrar
    call_site: apps/api/src/modules/domains/internal/orders.service.ts
  - id: m08-data-placement
    milestone: M08
    where: Database, cache and bucket placement and backup region
    data_classes:
      - customer-content
      - credentials
    processor_kind: database
    enforcement: enforced
    flag: residency.enforce.data
    call_site: apps/api/src/modules/data/internal/database-flow.ts
  - id: m08-cache-placement
    milestone: M08
    where: Cache placement
    data_classes:
      - customer-content
    processor_kind: cache
    enforcement: enforced
    flag: residency.enforce.cache
    call_site: apps/api/src/modules/data/internal/database-flow.ts
  - id: m08-object-storage
    milestone: M08
    where: Object storage placement and signed-URL regions
    data_classes:
      - customer-content
    processor_kind: object-storage
    enforcement: enforced
    flag: residency.enforce.storage
    call_site: apps/api/src/modules/data/internal/storage-flow.ts
  - id: m08-transactional-email
