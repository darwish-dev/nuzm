tenant_less:
  # user-scoped identity data (hashes/refs only); access via session/token hash lookups
  - identity.users
  - identity.credentials
  - identity.auth_tokens
  - identity.sessions
  - identity.mfa_factors
  - identity.recovery_codes
  # provider callbacks arrive before an org is known; deduped by (provider, event_id)
  - platform.webhook_events_inbound
  # RBAC reference data (seeded by migration; read-only to runtime roles)
  - tenancy.roles
  - tenancy.permissions
  - tenancy.role_permissions
  # platform-role assignments: tenant-less by nature (platform staff, not org members)
  - tenancy.platform_roles
  # plan catalogue: global reference data, readable by every runtime role, written only from the admin console scope
  - billing.plans
  - billing.plan_versions
  # meter catalogue: global reference data, written only from the admin console scope
  - metering.meters
  # price books: global reference data (public price list), written only from the admin console scope
  - billing.price_books
  - billing.quota_meters
  # platform configuration read by every runtime role, written by seed/config migrations only (docs/11 §4, §6)
  - invoicing.billing_entities
  - invoicing.tax_rates
  - invoicing.invoice_sequences
  # e-invoicing onboarding and credential REFERENCES (vault refs only): per billing entity and environment, admin console scope only (S11b)
  - invoicing.zatca_onboarding
  - invoicing.zatca_credentials_refs
  # financial reconciliation results span organizations: admin console scope only (S12a)
  - finrec.reconciliation_runs
  - finrec.reconciliation_items
  - finrec.reconciliation_resolutions
  # payment service providers: configuration (psp_accounts) and the webhook intake (psp_events; only the psp_webhook scope can touch it)
  - payments.psp_accounts
  - payments.psp_events
  - billing.price_book_versions
  - billing.price_items
  # hash-chain heads: private to audit trigger/verifier functions (no runtime grants)
  - audit.chain_heads
  # classification catalogue: global reference data seeded by migration, read-only to runtime roles (M04 S13a)
  - compliance.data_classes
  # archival registry: platform configuration, written by migration only (M04 S13c)
  - audit.archivable_tables
  # retention policies: platform configuration, versioned, admin scope only (M04 S13c)
  - audit.retention_policies
  # control register, evidence, validations and breach cases: platform registers, admin scope only (M04 S15)
  - compliance.control_catalog
  - compliance.control_mappings
  - compliance.evidence_items
  - compliance.regulatory_validations
  - compliance.breach_cases
  - domains.registrar_accounts
  - domains.registrars
  # provider selection config for managed data and email (M08 S32): platform register, admin scope only; nothing is seeded, nothing is enabled by default
  - data.data_providers
  # provider registry, accounts (vault REFERENCES only), verified regions, plans, capability matrix, evidence, catalog snapshots, platform jobs (M05 S16):
  # admin console scope only; customers see offers through the eligibility function, never these tables
  - cloud.providers
  - cloud.provider_accounts
  - cloud.evidence_items
  - cloud.provider_regions
  - cloud.provider_plans
  - cloud.provider_capabilities
  - cloud.catalog_snapshots
  - cloud.provider_jobs
  - cloud.live_verification_runs # M05 S23: results of human-triggered live verifications (append-only)
  # M05 S17: routing rules, reconciliation history (admin console scope) and the image catalogue (written by catalog syncs, admin scope)
  - cloud.routing_rules
  - cloud.resource_reconciliations
  - compute.images
  # hosting platform tables (M06): nodes, agents, capacity, the agent command log and the plan catalogue; admin scope only (the plan catalogue is readable by every runtime role)
  - hosting.nodes
  - hosting.node_overcommit_changes
  - hosting.node_agents
  - hosting.node_enrolment_tokens
  - hosting.node_capacity
  - hosting.node_command_log
  - hosting.plan_definitions
  - hosting.site_allocations
  - hosting.site_migrations
  # >>> M09 tenant-less
  # model provider registry (M09 S37): admin console scope; runtime roles read only ENABLED rows (through the gateway)
  - ai.model_providers
  # <<< M09 tenant-less
# isolated by RLS on their own key instead of an org_id column
rls_keyed:
  - tenancy.organizations
migration_ranges:
  M01: "0001-0199"
  M02: "0200-0299"
  M03: "0300-0499"
  M04: "0500-0599"
  M05: "0600-0799"
  M06: "0800-0899"
  M07: "0900-0999"
  M08: "1000-1199"
  M09: "1200-1399"
  M10: "1400-1599"
  M11: "1600-1699"
  M12: "1700-1799"
# Data classification (M04 S13a, D-14 proposal classes). EVERY column of every table is classified; the CI check `compliance:classification-coverage`
# (pnpm compliance:classification-coverage) fails on an unclassified or stale column, an unknown class, and on a column whose name looks personal,
# financial or credential-bearing but is marked internal/public. A new column needs a line here in the same pull request.
classification:
  classes: [public, internal, customer-content, personal, financial, credentials]
  # Columns whose NAME looks sensitive but whose content is not; each needs a reason (10+ characters).
  exceptions:
    data.database_instances.create_token: a deterministic idempotency token for a provider call (a hash of ids), not a credential
    email.email_domains.ownership_token: the public DNS TXT value that proves ownership of a domain (published in DNS by design), not a secret
    email.mailboxes.password_setup: holds only the kind of password setup and a vault REFERENCE to the reset link or one-time secret, never the secret itself
    email.mailboxes.create_token: a deterministic idempotency token for a provider call (a hash of ids), not a credential
    email.aliases.create_token: a deterministic idempotency token for a provider call (a hash of ids), not a credential
    email.messages.send_token: a deterministic idempotency token for a provider call (a hash of ids), not a credential
    email.messages.idempotency_key: the caller's Idempotency-Key header value (an opaque client-chosen id), not a credential
    data.storage_buckets.create_token: a deterministic idempotency token for a provider call (a hash of ids), not a credential
    data.database_backups.idempotency_token: a deterministic idempotency token for a provider call (a hash of ids), not a credential
    audit.audit_logs.actor_api_key_id: the opaque id of the API key that acted, never the key or its secret
    billing.price_items.unit_price_minor: an entry of the public price list, not a customer's money
    identity.credentials.password_set_at: the time the password was last changed, not the password or any part of it
    identity.users.email_verified: a boolean flag; the address itself is identity.users.email (personal)
    invoicing.billing_entities.legal_name_ar: the seller's own registered company name, printed on every invoice
    invoicing.billing_entities.legal_name_en: the seller's own registered company name, printed on every invoice
    invoicing.billing_entities.address: the seller's own registered business address, printed on every invoice
    domains.domain_orders.idempotency_token: a sha256 of org, operation and step ids, a deterministic business dedupe key sent to the registrar, not a credential
    hosting.plan_definitions.price_minor: an entry of the public hosting price list (PLACEHOLDER until published), not a customer's money
    hosting.site_domain_bindings.verification_token: a random domain-ownership challenge value that the customer publishes in their own DNS; proves nothing about us and grants no access
    hosting.sites.token: the deterministic idempotency token sha256(orgId|operationId|stepId) that names the site on its node; derived from ids, grants no access
    cloud.provider_accounts.spend_cap_minor: Nuzm's own spend cap on a provider account (an internal control), not a customer's money
    cloud.provider_plans.provider_price_minor: the provider's list price for a plan (our cost input), not a customer's money
    cloud.provider_regions.display_name: the provider's own name of a region, not a person's name
    cloud.resources.provision_token: a deterministic sha256 idempotency key for the provider call (orgId|operationId|stepId), not a credential
    # >>> M09 exceptions
    ai.budgets.run_max_tokens: a cap on LLM tokens (a count of text units), not an authentication token
    ai.budgets.total_tokens: a cap on LLM tokens (a count of text units), not an authentication token
    ai.model_providers.display_name: the model vendor's own product name, not a person's name
    ai.model_usage.tokens_in: a count of LLM input tokens (text units), not an authentication token
    ai.model_usage.tokens_out: a count of LLM output tokens (text units), not an authentication token
    ai.reservations.tokens: a count of reserved LLM tokens (text units), not an authentication token
    ai.runs.tokens_in: a count of LLM input tokens (text units), not an authentication token
    ai.runs.tokens_out: a count of LLM output tokens (text units), not an authentication token
    # <<< M09 exceptions
    # >>> M11 exceptions
    automation.webhook_endpoints.previous_secret_expires_at: the time until which the PREVIOUS signing secret still signs (rotation overlap); a timestamp, not a secret
    automation.execution_steps.idempotency_key: sha256(rootExecutionId|stepKey|attemptGroup), a deterministic dedupe key sent to receivers; derived from ids and grants no access
    # <<< M11 exceptions
  # How every credentials-class column is protected (M04 S13d). The check fails when a credentials column is not listed here, when the name does not
  # fit the protection (*_hash, *_ref, *_enc), and when an `encrypted` column holds a value that is not a sealed field value.
  #   hash      = one-way hash; the secret itself is never stored          vault_ref = a vault:// reference, the secret lives in the vault
  #   lookup    = the NON-secret lookup prefix of a key                    encrypted = field-level AES-256-GCM (apps/api/src/common/field-crypto.ts)
  protection:
    data.database_instances.vault_ref: vault_ref
    data.storage_buckets.credential_vault_ref: vault_ref
    email.messages.recipients_enc: encrypted
    email.messages.body_enc: encrypted
    email.suppressions.address_enc: encrypted
    audit.audit_checkpoints.key_ref: vault_ref
    identity.api_keys.prefix: lookup
    identity.api_keys.secret_hash: hash
    identity.mfa_factors.secret_ref: vault_ref
    identity.recovery_codes.code_hash: hash
    identity.sessions.token_hash: hash
    identity.credentials.password_hash: hash
    identity.auth_tokens.token_hash: hash
    identity.sessions.csrf_hash: hash
    hosting.node_enrolment_tokens.token_hash: hash
    hosting.sites.credentials_ref: vault_ref
    hosting.sites.backup_key_ref: vault_ref
    hosting.ssl_certificates.secret_ref: vault_ref
    hosting.site_backups.enc_key_ref: vault_ref
    invoicing.zatca_credentials_refs.key_ref: vault_ref
    invoicing.zatca_credentials_refs.token_ref: vault_ref
    invoicing.zatca_credentials_refs.secret_ref: vault_ref
    payments.payment_methods.token_ref: vault_ref
    cloud.provider_accounts.vault_ref: vault_ref
    tenancy.invitations.token_hash: hash
    invoicing.tax_profiles.pii_enc: encrypted
    compliance.dsr_requests.details_enc: encrypted
    domains.domain_transfers.auth_code_ref: vault_ref
    domains.domain_contacts.payload_enc: encrypted
    domains.registrar_accounts.webhook_secret_ref: vault_ref
    domains.registrar_accounts.vault_ref: vault_ref
    # >>> M09 protection
    ai.model_providers.vault_ref: vault_ref
    builder.previews.token_hash: hash
    builder.form_submissions.payload_enc: encrypted
    builder.forms.notify_email_enc: encrypted
    ai.messages.content_enc: encrypted
    ai.model_usage.body_enc: encrypted
    # <<< M09 protection
    # >>> M11 protection
    automation.connector_authorizations.vault_ref: vault_ref
    automation.connector_authorizations.pkce_verifier_ref: vault_ref
    automation.connector_authorizations.oauth_state_hash: hash
    automation.workflows.webhook_secret_ref: vault_ref
    automation.workflows.webhook_token_hash: hash
    automation.webhook_endpoints.secret_vault_ref: vault_ref
    automation.webhook_endpoints.previous_secret_vault_ref: vault_ref
    # <<< M11 protection
