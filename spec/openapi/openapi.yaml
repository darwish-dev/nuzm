              state: { type: string, enum: [supported, unsupported, unknown] }
              effective: { type: string, enum: [supported, unsupported] }
              probedAt: { type: string, format: date-time, nullable: true }
              evidenceRef: { type: string, nullable: true }
    ProviderRegionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, providerRegionId, countryCode, state]
