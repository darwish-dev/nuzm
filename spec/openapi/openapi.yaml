          }
        scopeNote: { type: string }
        spendCap: { $ref: '#/components/schemas/SpendCap' }
    ProviderAccountUpdate:
      type: object
      properties:
        name: { type: string }
        status: { type: string, enum: [active, disabled] }
        scopeNote: { type: string, nullable: true }
        credentialRef: { type: string }
        spendCap: { $ref: '#/components/schemas/SpendCap' }
    SpendCap:
      type: object
      required: [amountMinor, currency]
      properties:
        amountMinor: { type: string, description: 'Integer minor units.' }
        currency: { type: string }
    ProviderAccount:
      type: object
      required:
        [id, providerId, providerKey, adapterId, name, credentialRef, status, health, version]
      properties:
        id: { type: string, format: uuid }
        providerId: { type: string, format: uuid }
        providerKey: { type: string }
        adapterId: { type: string }
        name: { type: string }
        credentialRef: { type: string }
        scopeNote: { type: string, nullable: true }
        status: { type: string }
        health:
          type: object
          properties:
            state: { type: string, enum: [healthy, degraded, unhealthy, unknown] }
            lastHealthAt: { type: string, format: date-time, nullable: true }
            breaker: { type: object, additionalProperties: true }
        spendCap: { allOf: [{ $ref: '#/components/schemas/SpendCap' }], nullable: true }
        verifiedAt: { type: string, format: date-time, nullable: true }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
    ProviderAccountList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ProviderAccount' } }
    ProviderJob:
      type: object
