      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CloudResourceList' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/admin/resources/{id}/reconciliations:
    post:
      operationId: adminReconcileResource
      tags: [cloud]
      summary: 'Force a reconciliation'
      description: '202 with a platform job id (poll GET /v1/admin/provider-jobs/{id}). The reconciler never retries a provision unless the provider lookup proved absence and never deletes automatically.'
      x-nuzm-platform-permission: admin:provider:manage
      x-nuzm-realm: admin
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
            description: 'Identifier.',
          }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderJobAccepted' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/webhooks/cloud/{provider}:
    post:
      operationId: receiveCloudWebhook
      tags: [cloud]
      summary: 'Provider webhook'
      description: 'Unauthenticated by design (a verified signature over the raw body is the authentication). No provider adapter supports webhooks yet, so every provider answers 404; nothing is stored.'
      security: []
      parameters:
        - {
            name: provider,
            in: path,
            required: true,
            schema: { type: string },
            description: 'Provider key.',
          }
      responses:
        '200': { description: Success }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/admin/provider-costs:
    get:
      operationId: adminListProviderCosts
      tags: [cloud]
      summary: 'Provider cost records'
      description: 'What the providers charge Nuzm (metering.provider_cost_records), in the provider currency as integer minor units, with totals per currency. Platform only; never shown to customers. Records are captured from closed billing periods (adapter fetchBilling) or the manual import. Keyset pagination (cursor).'
      x-nuzm-platform-permission: admin:provider:read
      x-nuzm-realm: admin
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: providerAccountId, in: query, required: false, schema: { type: string, format: uuid }, description: 'Filter by provider account.' }
        - { name: period, in: query, required: false, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }, description: 'Billing month YYYY-MM.' }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200 }, description: 'Page size (default 50).' }
        - { name: cursor, in: query, required: false, schema: { type: string }, description: 'Opaque cursor from nextCursor.' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderCostList' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/admin/live-verification:
    get:
      operationId: adminListLiveVerification
      tags: [cloud]
      summary: 'Live-verification jobs and recorded runs'
      description: 'The three human-triggered live-verification jobs (alibaba, huawei, contabo) with their gate state (HG-05-01..03 PENDING|GRANTED) and label (NOT RUN | NOT VERIFIED | LIVE-VERIFIED | FAIL), plus recorded runs. READ-ONLY: no operation starts a run.'
      x-nuzm-platform-permission: admin:provider:read
      x-nuzm-realm: admin
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveVerificationOverview' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/admin/live-verification/runs:
    post:
      operationId: adminRecordLiveVerificationRun
      tags: [cloud]
      summary: 'Record the result of a human-triggered live verification'
      description: 'Stores what the owner-run job reported (append-only). LIVE-VERIFIED is accepted only with the owner gate evidence id, at least one evidence id and zero residual resources; fixtures and mocks are NOT VERIFIED. This does not start anything.'
      x-nuzm-platform-permission: admin:provider:manage
      x-nuzm-realm: admin
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordLiveVerificationRun' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveVerificationRecorded' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

components:
  parameters:
    OrgHeader:
      name: X-Nuzm-Org
      in: header
      required: false
      schema: { type: string, format: uuid }
      description: Active organization for session callers (verified against membership; API keys fix their own org).
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 255 }
      description: Makes the request safely retryable; same key plus same body replays the first response.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
      description: ETag of the version being modified; stale values return 412.
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      description: Page size.
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
      description: Opaque cursor from nextCursor.
  securitySchemes:
    sourceKey:
      type: http
      scheme: bearer
      description: Per-source metering service key (internal producers). Not a user credential.
    apiKey:
      type: http
      scheme: bearer
      description: Organization API key (nzk_…), scoped to a subset of its creator's permissions.
    sessionCookie:
      type: apiKey
      in: cookie
      name: nuzm_session
      description: Opaque server-side session (admin realm uses nuzm_admin_session).
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Double-submit CSRF token, required on unsafe methods with cookie auth.
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ResidencyMode:
      type: string
      enum: [in_kingdom_only, allow_listed, unrestricted_with_assessment]
    ResidencyPolicy:
      type: object
      required: [version, isDefault, mode, allowedCountriesByClass, exceptions, floor, updatedAt]
      properties:
        version: { type: integer, description: '0 = no policy of its own: the default applies.' }
        isDefault: { type: boolean }
        mode: { $ref: '#/components/schemas/ResidencyMode' }
        allowedCountriesByClass:
          { type: object, additionalProperties: { type: array, items: { type: string } } }
        exceptions: { type: array, items: { type: string, format: uuid } }
        floor:
          type: object
          required: [version, byClass]
          properties:
            version: { type: integer }
            byClass:
              { type: object, additionalProperties: { $ref: '#/components/schemas/ResidencyMode' } }
        updatedAt: { type: [string, 'null'], format: date-time }
    PutResidencyPolicy:
      type: object
      required: [mode]
      properties:
        mode: { $ref: '#/components/schemas/ResidencyMode' }
        allowedCountriesByClass:
          {
            type: object,
            additionalProperties:
              { type: array, maxItems: 60, items: { type: string, pattern: '^[A-Z]{2}$' } },
          }
        exceptions: { type: array, maxItems: 50, items: { type: string, format: uuid } }
        changeNote: { type: [string, 'null'], maxLength: 500 }
    TransferAssessment:
      type: object
      required:
        [
          id,
          orgId,
          dataClass,
          region,
          processorId,
          risk,
          mitigations,
          status,
          expired,
          requestedBy,
          decidedBy,
          decidedAt,
          decisionNote,
          expiresAt,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: [string, 'null'], format: uuid }
        dataClass: { type: string }
        region: { type: string }
        processorId: { type: [string, 'null'] }
        risk: { type: string, enum: [low, medium, high] }
        mitigations: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        expired: { type: boolean, description: 'An approved assessment past its expiry.' }
        requestedBy: { type: string, format: uuid }
        decidedBy: { type: [string, 'null'], format: uuid }
        decidedAt: { type: [string, 'null'], format: date-time }
        decisionNote: { type: [string, 'null'] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    TransferAssessmentRequest:
      type: object
      description: 'One of: create {dataClass, region, processorId?, risk, mitigations, expiresAt, orgId?}; decide {assessmentId, decision, note?}.'
      properties:
        dataClass: { type: string }
        region: { type: string, pattern: '^([A-Z]{2}|gcc|eu|other)$' }
        processorId: { type: [string, 'null'], maxLength: 120 }
        risk: { type: string, enum: [low, medium, high] }
        mitigations: { type: string, minLength: 10, maxLength: 2000 }
        expiresAt: { type: string, format: date-time }
        orgId: { type: [string, 'null'], format: uuid }
        assessmentId: { type: string, format: uuid }
        decision: { type: string, enum: [approve, reject] }
        note: { type: string, maxLength: 500 }
    TransferAssessmentPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/TransferAssessment' } }
        nextCursor: { type: [string, 'null'] }
    RetentionPolicy:
      type: object
      required:
        [
          id,
          dataClass,
          dataset,
          version,
          retainDays,
          archiveAfterDays,
          basis,
          status,
          documentRef,
          approvedBy,
          changeNote,
          createdBy,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        dataClass: { type: string }
        dataset: { type: [string, 'null'] }
        version: { type: integer }
        retainDays: { type: integer }
        archiveAfterDays: { type: integer }
        basis: { type: string }
        status: { type: string, enum: [proposal, approved] }
        documentRef: { type: [string, 'null'] }
        approvedBy: { type: [string, 'null'], format: uuid }
        changeNote: { type: [string, 'null'] }
        createdBy: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
    PutRetentionPolicy:
      type: object
      required: [dataClass, retainDays, archiveAfterDays, basis]
      properties:
        dataClass: { type: string }
        dataset: { type: [string, 'null'], pattern: '^[a-z_]+\.[a-z_]+$' }
        retainDays: { type: integer, minimum: 1, maximum: 36500 }
        archiveAfterDays: { type: integer, minimum: 1, maximum: 36500 }
        basis: { type: string, minLength: 3, maxLength: 500 }
        status: { type: string, enum: [proposal, approved], default: proposal }
        documentRef: { type: [string, 'null'], maxLength: 200 }
        changeNote: { type: [string, 'null'], maxLength: 500 }
        baseVersion: { type: [integer, 'null'], minimum: 1 }
    RetentionPartitionPreview:
      type: object
      required: [partition, upperBound, rows, heldRows, eligible, blockedBy]
      properties:
        partition: { type: string }
        upperBound: { type: string, format: date-time }
        rows: { type: integer }
        heldRows: { type: integer }
        eligible: { type: boolean }
        blockedBy: { type: [string, 'null'], enum: [legal_hold, null] }
    RetentionTargetPreview:
      type: object
      required:
        [
          dataset,
          dataClass,
          policy,
          archiveCutoff,
          expiryCutoff,
          archiveCandidates,
          expiryCandidates,
          heldCandidates,
          eligibleToArchive,
          execution,
          partitions,
          note,
        ]
      properties:
        dataset: { type: string }
        dataClass: { type: string }
        policy:
          type: object
          required: [version, status, retainDays, archiveAfterDays, dataset]
          properties:
            version: { type: integer }
            status: { type: string, enum: [proposal, approved] }
            retainDays: { type: integer }
            archiveAfterDays: { type: integer }
            dataset: { type: [string, 'null'] }
        archiveCutoff: { type: string, format: date-time }
        expiryCutoff: { type: string, format: date-time }
        archiveCandidates: { type: integer }
        expiryCandidates: { type: integer }
        heldCandidates: { type: integer }
        eligibleToArchive: { type: integer }
        execution: { type: string, enum: [partition-detach, not-built] }
        partitions:
          { type: array, items: { $ref: '#/components/schemas/RetentionPartitionPreview' } }
        note: { type: string }
    RetentionPreview:
      type: object
      required: [dryRun, asOf, proposalPolicies, targets]
      properties:
        dryRun: { type: boolean, enum: [true] }
        asOf: { type: string, format: date-time }
        proposalPolicies:
          { type: boolean, description: 'True while any policy used is still a proposal.' }
        targets: { type: array, items: { $ref: '#/components/schemas/RetentionTargetPreview' } }
    RetentionPolicyList:
      type: object
      required: [items, nextCursor, preview]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RetentionPolicy' } }
        nextCursor: { type: [string, 'null'] }
        preview: { oneOf: [{ $ref: '#/components/schemas/RetentionPreview' }, { type: 'null' }] }
    LegalHoldRequest:
      type: object
      description: 'One of: create {scope, reason, approvers}; decide {holdId, decision, note?}; release {holdId, action: release, reason}.'
      properties:
        scope:
          type: object
          properties:
            orgId: { type: string, format: uuid }
            dataset: { type: string, pattern: '^[a-z_]+\.[a-z_]+$' }
        reason: { type: string, minLength: 10, maxLength: 500 }
        approvers: { type: array, minItems: 2, maxItems: 2, items: { type: string, format: uuid } }
        holdId: { type: string, format: uuid }
        decision: { type: string, enum: [approve, reject] }
        action: { type: string, enum: [release] }
        note: { type: string, maxLength: 500 }
    LegalHold:
      type: object
      required:
        [
          id,
          orgId,
          dataset,
          reason,
          status,
          requestedBy,
          approverId,
          decidedAt,
          decisionNote,
          releasedBy,
          releasedAt,
          releaseReason,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: [string, 'null'], format: uuid }
        dataset: { type: [string, 'null'] }
        reason: { type: string }
        status: { type: string, enum: [pending_approval, active, rejected, released] }
        requestedBy: { type: string, format: uuid }
        approverId: { type: string, format: uuid }
        decidedAt: { type: [string, 'null'], format: date-time }
        decisionNote: { type: [string, 'null'] }
        releasedBy: { type: [string, 'null'], format: uuid }
        releasedAt: { type: [string, 'null'], format: date-time }
        releaseReason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    RopaProcessor:
      type: object
      required: [name, role, region, dataClasses]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        role: { type: string, enum: [processor, sub-processor] }
        region: { type: string, pattern: '^([A-Z]{2}|in_kingdom|gcc|eu|other)$' }
        dataClasses: { type: array, minItems: 1, maxItems: 6, items: { type: string } }
        contractRef: { type: [string, 'null'], maxLength: 200 }
    SaveRopaEntry:
      type: object
      required: [entryKey, activity, purpose, dataClasses, processors, regions]
      properties:
        entryKey:
          {
            type: string,
            pattern: '^[a-z][a-z0-9-]*(:[a-z0-9][a-z0-9-]*)?$',
            minLength: 3,
            maxLength: 80,
          }
        kind:
          {
            type: string,
            enum: [activity, adapter],
            description: 'Required for a new entry; fixed afterwards.',
          }
        adapterKind:
          { type: string, description: 'Required for kind adapter (a kind of docs/09 §1).' }
        activity: { type: string, minLength: 1, maxLength: 200 }
        purpose: { type: string, minLength: 1, maxLength: 500 }
        dataClasses: { type: array, minItems: 1, maxItems: 6, items: { type: string } }
        processors:
          { type: array, maxItems: 50, items: { $ref: '#/components/schemas/RopaProcessor' } }
        regions:
          { type: array, items: { type: string, pattern: '^([A-Z]{2}|in_kingdom|gcc|eu|other)$' } }
        retentionRef: { type: [string, 'null'], maxLength: 100 }
        status: { type: string, enum: [draft, reviewed], default: draft }
        changeNote: { type: [string, 'null'], maxLength: 500 }
        baseVersion:
          {
            type: [integer, 'null'],
            minimum: 1,
            description: 'The current version; omit to create.',
          }
    RopaEntry:
      type: object
      required:
        [
          id,
          entryKey,
          version,
          kind,
          adapterKind,
          activity,
          purpose,
          dataClasses,
          processors,
          regions,
          retentionRef,
          status,
          reviewedBy,
          changeNote,
          createdBy,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        entryKey: { type: string }
        version: { type: integer }
        kind: { type: string, enum: [activity, adapter] }
        adapterKind: { type: [string, 'null'] }
        activity: { type: string }
        purpose: { type: string }
        dataClasses: { type: array, items: { type: string } }
        processors: { type: array, items: { $ref: '#/components/schemas/RopaProcessor' } }
        regions: { type: array, items: { type: string } }
        retentionRef: { type: [string, 'null'] }
        status: { type: string, enum: [placeholder, draft, reviewed] }
        reviewedBy: { type: [string, 'null'], format: uuid }
        changeNote: { type: [string, 'null'] }
        createdBy:
          { type: [string, 'null'], format: uuid, description: 'null for a seeded placeholder' }
        createdAt: { type: string, format: date-time }
    RopaPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RopaEntry' } }
        nextCursor: { type: [string, 'null'] }
    GrantConsent:
      type: object
      required: [purposeId, granted, localeShown, textVersion]
      properties:
        purposeId: { type: string, pattern: '^[a-z][a-z0-9_]{2,60}$' }
        granted: { type: boolean, enum: [true] }
        localeShown: { type: string, enum: [ar, en] }
        textVersion: { type: string, minLength: 1, maxLength: 40 }
        subjectRef:
          {
            type: string,
            pattern: '^[A-Za-z0-9:_.-]{1,128}$',
            description: 'Opaque subject id; omitted = the caller; needs privacy:consent:manage for anyone else.',
          }
    Consent:
      type: object
      required:
        [id, purposeId, subjectRef, state, textVersion, locale, source, withdrawsId, createdAt]
      properties:
        id: { type: string, format: uuid }
        purposeId: { type: string }
        subjectRef: { type: string }
        state: { type: string, enum: [granted, withdrawn] }
        textVersion: { type: string }
        locale: { type: string, enum: [ar, en] }
        source: { type: string, enum: [api, ui] }
        withdrawsId: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
    OpenDsr:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [access, correction, deletion, portability] }
        subjectRef: { type: string }
        identityAttestation: { type: string, minLength: 10, maxLength: 500 }
        details:
          type: object
          properties:
            text: { type: string, maxLength: 2000 }
            patch: { type: object, additionalProperties: true }
    DsrTask:
      type: object
      required: [handler, action, status, attempts, reasonCode, reason]
      properties:
        handler: { type: string }
        action: { type: string }
        status: { type: string }
        attempts: { type: integer }
        reasonCode: { type: [string, 'null'] }
        reason:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/LocalizedText' }
    LocalizedText:
      type: object
      required: [ar, en]
      properties:
        ar: { type: string }
        en: { type: string }
    DsrRequest:
      type: object
      required:
        [
          id,
          type,
          subjectRef,
          status,
          receivedAt,
          dueAt,
          slaState,
          identityMethod,
          identityVerifiedAt,
          hasDetails,
          reasonCode,
          reason,
          outcome,
          tasks,
          operationId,
          downloadUrl,
          closedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [access, correction, deletion, portability] }
        subjectRef: { type: string }
        status: { type: string }
        receivedAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time }
        slaState: { type: string, enum: [ok, warning, escalated, overdue] }
        identityMethod: { type: string, enum: [session, org_attestation] }
        identityVerifiedAt: { type: [string, 'null'], format: date-time }
        hasDetails: { type: boolean }
        reasonCode: { type: [string, 'null'] }
        reason:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/LocalizedText' }
        outcome: { type: [object, 'null'], additionalProperties: true }
        tasks: { type: array, items: { $ref: '#/components/schemas/DsrTask' } }
        operationId: { type: [string, 'null'], format: uuid }
        downloadUrl: { type: [string, 'null'] }
        closedAt: { type: [string, 'null'], format: date-time }
    DsrRequestPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/DsrRequest' } }
        nextCursor: { type: [string, 'null'] }
    CreateDataExport:
      type: object
      required: [scope]
      properties:
        scope: { type: string, enum: [org, user] }
        subjectRef: { type: string }
    DataExport:
      type: object
      required:
        [
          id,
          scope,
          subjectRef,
          status,
          requestedAt,
          expiresAt,
          bytes,
          sha256,
          downloadUrl,
          dsrRequestId,
        ]
      properties:
        id: { type: string, format: uuid }
        scope: { type: string, enum: [org, user] }
        subjectRef: { type: [string, 'null'] }
        status: { type: string, enum: [pending, running, succeeded, failed, expired] }
        requestedAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        bytes: { type: [integer, 'null'] }
        sha256: { type: [string, 'null'] }
        downloadUrl: { type: [string, 'null'] }
        dsrRequestId: { type: [string, 'null'], format: uuid }
    DataExportPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/DataExport' } }
        nextCursor: { type: [string, 'null'] }
    ControlPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Control' } }
        nextCursor: { type: [string, 'null'] }
    Control:
      type: object
      required:
        [
          controlId,
          title,
          description,
          frameworks,
          applicability,
          ownerRole,
          implementation,
          evidenceSpec,
          reviewCadenceDays,
          claimsCompliance,
          status,
          mappings,
          evidence,
        ]
      properties:
        controlId: { type: string }
        title: { type: string }
        description: { type: string }
        frameworks:
          type: array
          items:
