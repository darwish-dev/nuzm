        - {
            name: state,
            in: query,
            schema:
              {
                type: string,
                enum:
                  [
                    detected,
                    triaged,
                    assessed,
                    notification_decision,
                    notified,
                    remediation,
                    closed,
                  ],
              },
          }
        - {
            name: severity,
            in: query,
            schema: { type: string, enum: [low, medium, high, critical] },
          }
