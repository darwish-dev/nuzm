openapi: 3.1.0
info:
  title: Nuzm Platform API
  version: 0.0.0
  description: >
    Contract-first API. Implemented operations live under `paths`. Planned operations are inventoried in `planned-paths.yaml` (generated from docs/04) and are NOT part of the contract until implemented by their milestone. Conventions: docs/04 section 1.
  license:
    name: UNLICENSED
servers:
  - url: http://127.0.0.1:4000
    description: Local development
tags:
  - name: automation
    description: Workflows, executions, connectors and outbound webhooks (M11)
  - name: marketplace
    description: Template marketplace - listings, moderation, purchases, installations (M11)
  - name: programs
    description: Agency (delegated access) and reseller (sub-organizations, price rules, statements) programs (M11)
  - name: hosting
    description: Shared hosting sites, nodes and abuse cases
  - name: email
    description: Business mailboxes, sending domains, transactional email, suppressions and webhooks (M08)
  - name: data
    description: Managed databases, Redis, object storage and provider selection (M08)
  - name: payments
    description: Payment methods, payments and PSP webhooks
  - name: commerce
    description: Quotes and orders
  - name: usage
    description: Usage, quotas and raw events
  - name: platform
    description: Platform health
  - name: auth
    description: OIDC login, sessions and MFA
  - name: identity
    description: Current principal
  - name: organizations
    description: Organizations
  - name: members
    description: Membership and roles
  - name: invitations
    description: Invitations
  - name: rbac
    description: Role and permission catalogue
  - name: workspaces
    description: Workspaces
  - name: projects
    description: Projects
  - name: environments
    description: Environments
  - name: api-keys
    description: API keys
  - name: operations
    description: Durable operations
  - name: resources
    description: Resource inventory
  - name: audit
    description: Tamper-evident audit log
  - name: notifications
    description: In-app notifications
  - name: metering
    description: Usage ingestion and the meter catalogue
  - name: billing
    description: Plans, entitlements, ledger statement and wallet balance
  - name: admin
    description: Admin console (platform roles, admin realm, MFA-verified session)
  - name: compliance
    description: Consent, privacy requests, residency and compliance registers
  - name: cloud
    description: Provider framework and compute - provider registry, accounts (vault references only), capability matrix, verified regions, plans, offers, routing, quotes, instances, reconciliation (M05; live provider checks are BLOCKED until HG-05-01..03)
  - name: domains
    description: Domains, registrars, DNS and domain webhooks (M07)
  - name: ai
    description: AI core - model gateway, budgets and credits, sessions and runs, model providers (M09; no provider is enabled by default, D-18/HG-09-01 OPEN)
  - name: builder
    description: Website builder - projects, site model, changes, versions, previews, forms and CMS (M09)
  - name: deploy
    description: Deployments of builder projects to hosting sites (M09; live publish BLOCKED until HG-05-01/02, HG-06-01)
  - name: enterprise
    description: Enterprise SSO, access reviews (M12)
  - name: scim
    description: SCIM 2.0 server at /scim/v2 (M12)
  - name: ops-console
    description: Operational health, incidents, alerts, recovery exercises (M12)
  - name: mobile
    description: 'Mobile (Flutter) builder (M10B): builds, signing credential references and release-preparation records; no store submission'
  - name: ai-studio
    description: Project instructions, Skills, GitHub and the Claude Code proof of concept (ADR-064)
  - name: app-builder
    description: 'AI app builder (M10A): sandboxes, tests, exports and approvals of generated web apps'
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [platform]
      summary: Liveness probe
      description: Returns 200 when the API process is serving requests. Does not check dependencies.
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '404':
          description: Unknown route
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/auth/oidc/login:
    get:
      operationId: oidcLogin
      tags: [auth]
      summary: Start OIDC login (authorization code + PKCE S256)
      description: Redirects to the identity provider. `returnTo` must be a relative path or an allow-listed origin.
      security: []
      parameters:
        - name: returnTo
          in: query
          required: false
          schema: { type: string, maxLength: 2048 }
          description: Where to land after login.
        - name: realm
          in: query
          required: false
          schema: { type: string, enum: [web, admin], default: web }
          description: Console signing in. `admin` sessions are only issued to platform (staff) users and always require MFA.
      responses:
        '302': { description: Redirect to the identity provider }
        '400': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/auth/oidc/callback:
    get:
      operationId: oidcCallback
      tags: [auth]
      summary: Complete OIDC login and issue the session cookies
      description: Validates state, exchanges the code with the PKCE verifier, validates the ID token and creates a session.
      security: []
      parameters:
        - {
            name: code,
            in: query,
            required: false,
            schema: { type: string },
            description: Authorization code.,
          }
        - {
            name: state,
            in: query,
            required: false,
            schema: { type: string },
            description: Opaque state echoed from login.,
          }
        - {
            name: error,
            in: query,
            required: false,
            schema: { type: string },
            description: Error code from the identity provider.,
          }
      responses:
        '302': { description: Redirect to returnTo with session and CSRF cookies set }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the current session
      description: Requires the CSRF header. Clears the session cookies.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/auth/register:
    post:
      operationId: registerAccount
      tags: [auth]
      summary: Register a customer account with email and password
      description: >-
        Creates a user (issuer `nuzm:local`, status active, email NOT verified) and signs it in (session and CSRF cookies, web realm). The password is stored only as a salted hash (ADR-008). Password policy: 12 to 128 characters, not the email address, not a very common password. Sends an email-verification message (`email_verified` stays false until the link is used; where mail cannot be sent the account is still created). Rate limited per client address. Never creates platform (staff) users. Audited (auth.account.registered).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterAccountRequest' }
      responses:
        '201':
          description: Account created and signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUser' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /v1/auth/password/login:
    post:
      operationId: passwordLogin
      tags: [auth]
      summary: Sign in with email and password
      description: >-
        `realm: web` (default) is the customer sign-in; `realm: admin` is the staff sign-in (platform users only). An unknown email, a wrong password, a locked account, a disabled user and an account of the other kind (a customer at the admin sign-in, a staff user at the customer one) all answer the same 401 `invalid_credentials` (no account enumeration; an unknown email costs the same time). After 5 consecutive failures the account is locked for 15 minutes (proposal). Success mints a new session of that realm (a presented session cookie of the same realm is revoked first) and sets its session and CSRF cookies. An admin session is NOT yet usable: the admin console requires two-factor verification (403 `mfa_required` until it is done). Audited (auth.login.succeeded, auth.login.failed).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordLoginRequest' }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUser' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /v1/auth/password/forgot:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Ask for a password-reset email
      description: >-
        Always answers 202, whether or not the address belongs to an account (no enumeration). When it does, a single-use token valid for 1 hour is emailed and any earlier reset token is cancelled. Rate limited. Audited (auth.password.reset_requested).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        '202': { description: Accepted }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /v1/auth/password/reset:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Set a new password with a reset token
      description: >-
        Consumes the token (single use, 1 hour), stores the new password, clears the lockout and revokes EVERY session of the user. Audited (auth.password.reset).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '204': { description: Password changed }
        '400': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /v1/auth/password/change:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the signed-in user's password
      description: >-
        Needs the current password (a wrong one counts toward the lockout) and a CSRF header; works for a customer or a staff session. Refused while impersonating. Revokes every OTHER session of the user. Audited (auth.password.changed).
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: Password changed }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/auth/email/verification:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Confirm an email address with the emailed token
      description: Single use, valid 24 hours. Sets `emailVerified`. Audited (auth.email.verified).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyEmailRequest' }
      responses:
        '204': { description: Email verified }
        '400': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /v1/auth/email/verification/resend:
    post:
      operationId: resendEmailVerification
      tags: [auth]
      summary: Send the verification email again
      description: Signed-in users only; cancels earlier tokens. 204 when the address is already verified.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '202': { description: Accepted }
        '204': { description: Already verified }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /v1/auth/sessions:
    get:
      operationId: listSessions
      tags: [auth]
      summary: List the caller's active sessions
      description: Only the caller's own sessions are returned; `current` marks the calling session.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Session' } }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Problem' }
  /v1/auth/sessions/{id}:
    delete:
      operationId: revokeSession
      tags: [auth]
      summary: Revoke one of the caller's sessions
      description: Unknown and foreign sessions both return 404.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
            description: Session id.,
          }
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/me:
    get:
      operationId: getMe
      tags: [identity]
      summary: Current principal
      description: Memberships, permissions and feature flags are populated once tenancy lands (M01 S03).
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Principal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/auth/mfa/factors:
    post:
      operationId: enrollMfaFactor
      tags: [auth]
      summary: Start TOTP enrolment
      description: The secret and otpauth URI are returned once; the secret is stored only in the secret store.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [totp] }
      responses:
        '201':
          description: Pending factor
          content:
            application/json:
              schema:
                type: object
                required: [id, type, status, otpauthUri, secret]
                properties:
                  id: { type: string, format: uuid }
                  type: { type: string }
                  status: { type: string, enum: [pending] }
                  otpauthUri: { type: string }
                  secret: { type: string }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/auth/mfa/factors/{id}/verification:
    post:
      operationId: verifyMfaFactor
      tags: [auth]
      summary: Verify a TOTP code or a recovery code
      description: Activates a pending factor, elevates the session and rotates its tokens. Failures count towards a lockout.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
            description: Factor id.,
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, pattern: '^[0-9]{6}$' }
                recoveryCode: { type: string }
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema:
                type: object
                required: [mfaLevel, activated]
                properties:
                  mfaLevel: { type: string, enum: [totp, recovery] }
                  activated: { type: boolean }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /v1/auth/mfa/factors/{id}:
    delete:
      operationId: removeMfaFactor
      tags: [auth]
      summary: Remove an MFA factor (step-up required)
      description: Needs a recent MFA verification. Platform users cannot remove their last active factor.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
            description: Factor id.,
          }
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/auth/mfa/recovery-codes:
    post:
      operationId: generateRecoveryCodes
      tags: [auth]
      summary: Generate 10 single-use recovery codes (step-up required)
      description: Shown once; invalidates any previous batch. Requires an active factor.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '201':
          description: Codes
          content:
            application/json:
              schema:
                type: object
                required: [codes]
                properties:
                  codes: { type: array, minItems: 10, maxItems: 10, items: { type: string } }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/organizations:
    post:
      operationId: createOrganization
      tags: [organizations]
      summary: Create an organization
      description: Create an organization.
      x-nuzm-access: any-authenticated
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrganization' }
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Generic' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listOrganizations
      tags: [organizations]
      summary: List the caller's organizations
      description: List the caller's organizations.
      x-nuzm-access: any-authenticated
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Generic' }
        '401': { $ref: '#/components/responses/Problem' }
  /v1/organizations/{orgId}:
    get:
      operationId: getOrganization
      tags: [organizations]
      summary: Get an organization
      description: Get an organization. Requires permission `org:read` in the active organization (path orgId or X-Nuzm-Org); a non-member receives 404.
      x-nuzm-permission: org:read
      x-nuzm-org-scoped: true
      security: [{ sessionCookie: [], csrfHeader: [] }, { apiKey: [] }]
      parameters:
        - {
            name: orgId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
            description: Organization id.,
          }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateOrganization
      tags: [organizations]
      summary: Update an organization
      description: Update an organization. Requires permission `org:update` in the active organization (path orgId or X-Nuzm-Org); a non-member receives 404. Requires If-Match with the current ETag.
      x-nuzm-permission: org:update
      x-nuzm-org-scoped: true
      security: [{ sessionCookie: [], csrfHeader: [] }, { apiKey: [] }]
      parameters:
        - {
            name: orgId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
            description: Organization id.,
          }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateOrganization' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /v1/organizations/{orgId}/members:
    get:
      operationId: listMembers
      tags: [members]
      summary: List members
      description: List members. Requires permission `member:read` in the active organization (path orgId or X-Nuzm-Org); a non-member receives 404.
      x-nuzm-permission: member:read
      x-nuzm-org-scoped: true
      security: [{ sessionCookie: [], csrfHeader: [] }, { apiKey: [] }]
      parameters:
        - {
            name: orgId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
            description: Organization id.,
          }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/organizations/{orgId}/members/{userId}:
    patch:
      operationId: changeMemberRole
      tags: [members]
      summary: Change a member's role
      description: Change a member's role. Requires permission `member:manage` in the active organization (path orgId or X-Nuzm-Org); a non-member receives 404. Requires a recent MFA verification (step-up). Requires If-Match with the current ETag.
      x-nuzm-permission: member:manage
      x-nuzm-org-scoped: true
      security: [{ sessionCookie: [], csrfHeader: [] }, { apiKey: [] }]
      parameters:
        - {
            name: orgId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
            description: Organization id.,
          }
        - {
            name: userId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
            description: Member user id.,
          }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeRole' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Generic' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: removeMember
      tags: [members]
      summary: Remove a member
      description: Remove a member. Requires permission `member:manage` in the active organization (path orgId or X-Nuzm-Org); a non-member receives 404.
      x-nuzm-permission: member:manage
      x-nuzm-org-scoped: true
      security: [{ sessionCookie: [], csrfHeader: [] }, { apiKey: [] }]
      parameters:
        - {
            name: orgId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
            description: Organization id.,
          }
        - {
            name: userId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
            description: Member user id.,
          }
      responses:
        '204': { description: Done }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/invitations:
    post:
      operationId: createInvitation
      tags: [invitations]
      summary: Invite a person by email
      description: Invite a person by email. Requires permission `member:invite` in the active organization (path orgId or X-Nuzm-Org); a non-member receives 404.
      x-nuzm-permission: member:invite
      x-nuzm-org-scoped: true
      security: [{ sessionCookie: [], csrfHeader: [] }, { apiKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgHeader' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
