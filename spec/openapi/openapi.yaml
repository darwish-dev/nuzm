        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/admin/billing/revenue-reports:
    get:
      operationId: adminGetRevenueReport
      tags: [billing]
      summary: Revenue and finance reports
      description: 'report = revenue (ledger revenue by month, product and billing entity), mrr (MRR/ARR of active and past-due subscriptions by plan, as of now), ar_aging (receivables per invoice from the ledger, bucketed as of `to`), vat (output tax by month and rate, compared with the ledger VAT account), margin (revenue vs provider cost accruals), refunds (refunds and credit notes with their ledger ties), dunning (funnel of cases opened in the period) or wallet (prepaid liability, opening, flows, closing). Amounts are integer minor units as strings. Every figure that has a ledger counterpart says whether it matches it. `from`/`to` default to the current month (at most 400 days; ar_aging and wallet closing use `to`). format=csv downloads a CSV file (text cells that look like formulas are neutralised). Reads span organizations and are audited. Platform permission `admin:reports:read` (finance, platform admin); admin-realm session.'
      x-nuzm-platform-permission: admin:reports:read
      x-nuzm-realm: admin
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - {
            name: report,
            in: query,
            required: true,
            schema:
              {
                type: string,
                enum: [revenue, mrr, ar_aging, vat, margin, refunds, dunning, wallet],
              },
          }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: format, in: query, schema: { type: string, enum: [json, csv], default: json } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinanceReport' }
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/billing/wallet-topups:
    post:
      operationId: createWalletTopup
      tags: [payments]
      summary: Top up the prepaid wallet
      description: 'Creates a top-up request and starts its payment with a saved method (default when paymentMethodId is omitted). The wallet is credited only when the payment is captured (ledger: PSP clearing to customer wallet, once). amount is {amount, currency} in minor units within the configured minimum and maximum. 201 created, 202 while the outcome is not known yet; requires_action carries nextAction (3-D Secure). VAT on prepaid credit is booked at consumption (policy D-25, awaiting tax-advisor confirmation). Requires permission `billing:manage`.'
      x-nuzm-permission: billing:manage
      x-nuzm-org-scoped: true
      security: [{ sessionCookie: [], csrfHeader: [] }, { apiKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgHeader' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWalletTopup' }
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletTopup' }
        '202':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletTopup' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/admin/billing/refunds:
    get:
      operationId: adminListRefunds
      tags: [payments]
      summary: List refunds across organizations
      description: 'S12d (UI-M03-15). Refunds newest first with their status, so finance can follow a pending refund. Filters: org, status (pending, succeeded, failed), paymentId. Platform permission `admin:billing:read`; admin-realm session; the read is audited (`billing.admin.refunds.read`). Read-only: a refund is still created only by POST.'
