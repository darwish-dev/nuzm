            buyerType: { type: string, enum: [b2b, b2c] }
        dataRegion: { type: string }
        zatca:
          type: object
          required: [state, uuid, qr]
          properties:
            state:
              {
                type: string,
                enum:
                  [
                    not_generated,
                    generated,
                    stamped,
                    queued,
                    submitted,
                    cleared,
                    reported,
                    rejected,
                    error,
                  ],
