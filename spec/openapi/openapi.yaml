        items:
          type: array
          items:
            type: object
            required: [id, providerRegionId, planRef, vcpu, memoryMb, diskGb, availability]
            properties:
              id: { type: string, format: uuid }
              providerRegionId: { type: string }
              planRef: { type: string }
