        cancelAtPeriodEnd: { type: boolean }
        cancelledAt: { type: [string, 'null'], format: date-time }
        pendingCreditMinor: { type: string, description: Credit applied to the next renewal. }
        latestInvoiceId: { type: [string, 'null'], format: uuid }
        dunningStage:
          type: [string, 'null']
          description: 'Stage of the open dunning case (overdue, reminder_1, reminder_2, restricted, suspended, terminated_pending); null when nothing is overdue.'
