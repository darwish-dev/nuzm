  # <<< AI Intelligence Center paths
components:
  parameters:
    OrgHeader:
      name: X-Nuzm-Org
      in: header
      required: false
      schema: { type: string, format: uuid }
      description: Active organization for session callers (verified against membership; API keys fix their own org).
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 255 }
      description: Makes the request safely retryable; same key plus same body replays the first response.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
      description: ETag of the version being modified; stale values return 412.
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      description: Page size.
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
      description: Opaque cursor from nextCursor.
    # >>> M11 parameters
    ActingOrgHeader:
      name: X-Nuzm-Acting-Org
      in: header
      required: false
      schema: { type: string, format: uuid }
      description: A client organization an AGENCY member acts in (with X-Nuzm-Org = the agency organization). Honoured only on routes marked x-nuzm-delegable, for cookie sessions, and only under an active, unexpired delegated-access grant; the effective permissions are the intersection of the member's role and the grant scopes. Everything else answers 403.
    # <<< M11 parameters
  securitySchemes:
    scimToken:
      type: http
      scheme: bearer
      description: Organization-scoped SCIM token (nzscim_…), issued per SSO connection; stored as a SHA-256 hash (M12).
    sourceKey:
      type: http
      scheme: bearer
      description: Per-source metering service key (internal producers). Not a user credential.
    apiKey:
      type: http
      scheme: bearer
      description: Organization API key (nzk_…), scoped to a subset of its creator's permissions.
    sessionCookie:
      type: apiKey
      in: cookie
      name: nuzm_session
      description: Opaque server-side session (admin realm uses nuzm_admin_session).
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Double-submit CSRF token, required on unsafe methods with cookie auth.
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    # >>> AI Studio schemas (ADR-064)
    StudioObject:
      type: object
      additionalProperties: true
      description: AI Studio payload (see the operation description for its fields).
    InstructionSection:
      type: object
      required: [id, title, rules]
      properties:
        id: { type: string }
        title: { type: string, maxLength: 80 }
        rules:
          type: array
          maxItems: 60
          items:
            type: object
            required: [text, strength]
            properties:
              text: { type: string }
              strength: { type: string, enum: [must, should, never, may] }
              key: { type: string }
    ProjectInstructionsInput:
      type: object
      properties:
        projectLayer:
          { type: array, maxItems: 30, items: { $ref: '#/components/schemas/InstructionSection' } }
        customerLayer:
          { type: array, maxItems: 30, items: { $ref: '#/components/schemas/InstructionSection' } }
        customerBlock: { type: string, maxLength: 20000 }
    ProjectInstructions:
      type: object
      required:
        [
          projectId,
          version,
          projectLayer,
          customerLayer,
          customerBlock,
          baseline,
          markdown,
          conflicts,
          canSync,
        ]
      properties:
        projectId: { type: string, format: uuid }
        version: { type: integer }
        projectLayer: { type: array, items: { $ref: '#/components/schemas/InstructionSection' } }
        customerLayer: { type: array, items: { $ref: '#/components/schemas/InstructionSection' } }
        customerBlock: { type: string }
        baseline: { type: array, items: { type: object, additionalProperties: true } }
        markdown: { type: string }
        conflicts: { type: array, items: { type: object, additionalProperties: true } }
        updatedAt: { type: string, format: date-time, nullable: true }
        canSync: { type: boolean }
    InstructionVersionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [version, createdAt]
            properties:
              version: { type: integer }
              createdBy: { type: string, format: uuid, nullable: true }
              createdAt: { type: string, format: date-time }
    Skill:
      type: object
      required: [id, slug, description, scope, status, owner]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        description: { type: string }
        category: { type: string, nullable: true }
        scope: { type: string }
        frameworks: { type: array, items: { type: string } }
        languages: { type: array, items: { type: string } }
        industries: { type: array, items: { type: string } }
        source: { type: object, additionalProperties: true }
        status: { type: string, enum: [in_review, approved, rejected, disabled] }
        owner: { type: string, enum: [platform, organization] }
        currentVersion: { type: object, nullable: true, additionalProperties: true }
        updatedAt: { type: string, format: date-time }
    SkillList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Skill' } }
    SkillFilesInput:
      type: object
      required: [files]
