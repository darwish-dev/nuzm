            schema: { $ref: '#/components/schemas/TransferAssessmentRequest' }
      responses:
        '200':
          description: Decision or replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferAssessment' }
        '201':
          description: Requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferAssessment' }
