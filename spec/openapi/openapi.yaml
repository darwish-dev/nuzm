    RecordLiveVerificationRun:
      type: object
      required: [jobId, status, reason]
      properties:
        jobId: { type: string, enum: [live-verify-alibaba, live-verify-huawei, live-verify-contabo] }
        status: { type: string, enum: [NOT RUN, NOT VERIFIED, LIVE-VERIFIED, FAIL] }
        reason: { type: string, maxLength: 1000 }
        steps: { type: array, items: { type: object, additionalProperties: true } }
        evidenceIds: { type: array, items: { type: string } }
        gateEvidenceId: { type: string }
        spendCapMinor: { type: string }
        currency: { type: string }
        residualResources: { type: integer, minimum: 0 }
    LiveVerificationRecorded:
      type: object
      required: [id, jobId, status]
      properties:
        id: { type: string, format: uuid }
        jobId: { type: string }
        status: { type: string }
