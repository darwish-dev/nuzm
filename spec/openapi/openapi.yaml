        definition: { type: object, additionalProperties: true }
        versions: { type: array, items: { type: object, additionalProperties: true } }
        webhook:
          {
            type: object,
            additionalProperties: true,
            description: 'Shown once at creation: {path, secret}.',
          }
        nextRunAt: { type: [string, 'null'] }
        lastRunAt: { type: [string, 'null'] }
        pausedReason: { type: [string, 'null'] }
        pausedByAdmin: { type: boolean }
        etag: { type: integer }
        createdAt: { type: string }
