            name: If-Match,
            in: header,
            required: false,
            schema: { type: string },
            description: 'ETag of the current version; required when a policy already exists.',
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PutResidencyPolicy' }
      responses:
        '200':
          description: Success
          headers:
