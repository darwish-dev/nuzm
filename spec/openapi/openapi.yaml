        id: { type: string, format: uuid }
        ruleKey: { type: string }
        version: { type: integer }
        priority: { type: integer }
        match: { type: object, additionalProperties: true }
        action: { type: object, additionalProperties: true }
        enabled: { type: boolean }
        note: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    RoutingRuleList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RoutingRule' } }
    CloudResource:
      type: object
      required:
        [
          id,
          orgId,
          kind,
          providerAccountId,
          state,
          dataRegion,
          country,
          providerRegionId,
          driftState,
        ]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        kind: { type: string }
        providerAccountId: { type: string, format: uuid }
        providerKey: { type: string, nullable: true }
        providerRef: { type: string, nullable: true }
