        role: { type: string, enum: [owner, admin, billing_admin, developer, viewer] }
    CreateInvitation:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { type: string, enum: [owner, admin, billing_admin, developer, viewer] }
    AcceptInvitation:
      type: object
      required: [token]
      properties:
        token: { type: string }
    CreateWorkspace:
      type: object
      required: [name]
      properties:
        name: { type: string }
        slug: { type: string }
    UpdateNamed:
      type: object
      properties:
        name: { type: string }
    CreateProject:
      type: object
      required: [workspaceId, name]
      properties:
        workspaceId: { type: string, format: uuid }
        name: { type: string }
        defaultRegionPolicy: { type: object }
    CreateEnvironment:
      type: object
      required: [name, kind]
      properties:
        name: { type: string }
        kind: { type: string, enum: [dev, staging, prod] }
        dataRegion: { type: string }
    CreateApiKey:
      type: object
      required: [name, scopes]
      properties:
        name: { type: string }
        scopes: { type: array, items: { type: string } }
        expiresAt: { type: string, format: date-time }
        ipAllowList: { type: array, items: { type: string } }
    Session:
      type: object
      required:
        [id, realm, createdAt, lastSeenAt, idleExpiresAt, absoluteExpiresAt, mfaLevel, current]
      properties:
        id: { type: string, format: uuid }
        realm: { type: string, enum: [web, admin] }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        idleExpiresAt: { type: string, format: date-time }
        absoluteExpiresAt: { type: string, format: date-time }
        mfaLevel: { type: string, enum: [none, totp, recovery] }
        userAgent: { type: [string, 'null'] }
        ip: { type: [string, 'null'] }
        current: { type: boolean }
    Me:
      type: object
      required:
        [
          id,
          email,
          emailVerified,
          locale,
          isPlatformUser,
          mfaLevel,
          memberships,
          permissions,
          featureFlags,
        ]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        emailVerified: { type: boolean }
        displayName: { type: [string, 'null'] }
        locale: { type: string, enum: [ar, en] }
        isPlatformUser: { type: boolean }
        mfaLevel: { type: string, enum: [none, totp, recovery] }
        mfaFactorId:
          type: [string, 'null']
          format: uuid
          description: The caller's active MFA factor (used to answer step-up challenges).
        impersonation:
          type: [object, 'null']
          description: Present only for a support impersonation session.
          properties:
            byUserId: { type: string, format: uuid }
            reason: { type: string }
            expiresAt: { type: [string, 'null'], format: date-time }
        memberships:
          type: array
          items:
            type: object
            required: [orgId, name, slug, type, status, role]
            properties:
              orgId: { type: string, format: uuid }
              name: { type: string }
              slug: { type: string }
              type: { type: string, enum: [customer, agency, reseller] }
              status: { type: string, enum: [active, suspended] }
              role: { type: string }
        permissions: { type: array, items: { type: string } }
        platform:
          type: [object, 'null']
          description: Platform roles and permissions; only for admin-realm sessions of staff.
          properties:
            roles: { type: array, items: { type: string } }
            permissions: { type: array, items: { type: string } }
        featureFlags: { type: object }
    Health:
      type: object
      required: [status, service, time]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
        time:
          type: string
          format: date-time
    Problem:
      description: RFC 9457 problem details (docs/04 section 1).
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        traceId:
          type: string
        mfaFactorId:
          type: [string, 'null']
          description: Only on `mfa_required` — the caller's active factor to challenge, or null when none is enrolled yet.
        errors:
          type: array
          items:
            type: object
    ProviderCreate:
      type: object
      required: [key, kind, adapterId]
      properties:
        key: { type: string }
        kind: { type: string }
        adapterId: { type: string }
        environmentPolicy: { type: string, enum: [any, non_production_only] }
    Provider:
      type: object
      required:
        [id, key, kind, adapterId, status, environmentPolicy, adapterAvailable, accountCount]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        kind: { type: string }
        adapterId: { type: string }
        status: { type: string }
        environmentPolicy: { type: string }
        adapterAvailable: { type: boolean }
        accountCount: { type: integer }
        createdAt: { type: string, format: date-time }
    ProviderList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Provider' } }
    ProviderAccountCreate:
      type: object
