    CancelSubscription:
      type: object
      properties:
        reason: { type: string, maxLength: 500 }
    Subscription:
      type: object
      required:
        [
          id,
          planVersionId,
          planKey,
          status,
          currency,
          quantity,
          paymentMethodId,
          amountPerPeriodMinor,
          currentPeriodStart,
          currentPeriodEnd,
          trialEnd,
          cancelAtPeriodEnd,
          cancelledAt,
          pendingCreditMinor,
          latestInvoiceId,
          version,
          createdAt,
        ]
