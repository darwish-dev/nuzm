openapi: 3.1.0
info:
  title: Nuzm Platform API
  version: 0.0.0
  description: >
    Contract-first API. Implemented operations live under `paths`. Planned operations are
    inventoried in `planned-paths.yaml` (generated from docs/04) and are NOT part of the contract
    until implemented by their milestone. Conventions: docs/04 section 1.
  license:
    name: UNLICENSED
servers:
  - url: http://127.0.0.1:4000
    description: Local development
tags:
  - name: payments
    description: Payment methods, payments and PSP webhooks
  - name: commerce
    description: Quotes and orders
  - name: usage
    description: Usage, quotas and raw events
  - name: platform
    description: Platform health
  - name: auth
    description: OIDC login, sessions and MFA
  - name: identity
    description: Current principal
  - name: organizations
    description: Organizations
  - name: members
    description: Membership and roles
  - name: invitations
    description: Invitations
  - name: rbac
    description: Role and permission catalogue
  - name: workspaces
    description: Workspaces
  - name: projects
    description: Projects
  - name: environments
    description: Environments
  - name: api-keys
    description: API keys
  - name: operations
    description: Durable operations
  - name: resources
    description: Resource inventory
  - name: audit
    description: Tamper-evident audit log
  - name: notifications
    description: In-app notifications
  - name: metering
    description: Usage ingestion and the meter catalogue
  - name: billing
    description: Plans, entitlements, ledger statement and wallet balance
  - name: admin
    description: Admin console (platform roles, admin realm, MFA-verified session)
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [platform]
      summary: Liveness probe
      description: Returns 200 when the API process is serving requests. Does not check dependencies.
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '404':
          description: Unknown route
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/auth/oidc/login:
    get:
      operationId: oidcLogin
      tags: [auth]
      summary: Start OIDC login (authorization code + PKCE S256)
      description: Redirects to the identity provider. `returnTo` must be a relative path or an allow-listed origin.
      security: []
      parameters:
        - name: returnTo
          in: query
          required: false
          schema: { type: string, maxLength: 2048 }
          description: Where to land after login.
        - name: realm
          in: query
          required: false
          schema: { type: string, enum: [web, admin], default: web }
          description: Console signing in. `admin` sessions are only issued to platform (staff) users and always require MFA.
      responses:
        '302': { description: Redirect to the identity provider }
        '400': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/auth/oidc/callback:
    get:
      operationId: oidcCallback
      tags: [auth]
      summary: Complete OIDC login and issue the session cookies
      description: Validates state, exchanges the code with the PKCE verifier, validates the ID token and creates a session.
      security: []
      parameters:
        - {
            name: code,
            in: query,
            required: false,
            schema: { type: string },
            description: Authorization code.,
          }
        - {
            name: state,
            in: query,
            required: false,
            schema: { type: string },
            description: Opaque state echoed from login.,
          }
        - {
            name: error,
            in: query,
            required: false,
            schema: { type: string },
            description: Error code from the identity provider.,
          }
      responses:
        '302': { description: Redirect to returnTo with session and CSRF cookies set }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the current session
      description: Requires the CSRF header. Clears the session cookies.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/auth/sessions:
    get:
      operationId: listSessions
      tags: [auth]
      summary: List the caller's active sessions
      description: Only the caller's own sessions are returned; `current` marks the calling session.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Session' } }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Problem' }
  /v1/auth/sessions/{id}:
    delete:
      operationId: revokeSession
      tags: [auth]
      summary: Revoke one of the caller's sessions
      description: Unknown and foreign sessions both return 404.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
            description: Session id.,
          }
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/me:
    get:
      operationId: getMe
      tags: [identity]
      summary: Current principal
      description: Memberships, permissions and feature flags are populated once tenancy lands (M01 S03).
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Principal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/auth/mfa/factors:
    post:
      operationId: enrollMfaFactor
      tags: [auth]
      summary: Start TOTP enrolment
      description: The secret and otpauth URI are returned once; the secret is stored only in the secret store.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [totp] }
      responses:
        '201':
          description: Pending factor
          content:
            application/json:
              schema:
                type: object
                required: [id, type, status, otpauthUri, secret]
                properties:
                  id: { type: string, format: uuid }
                  type: { type: string }
                  status: { type: string, enum: [pending] }
                  otpauthUri: { type: string }
                  secret: { type: string }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/auth/mfa/factors/{id}/verification:
    post:
      operationId: verifyMfaFactor
      tags: [auth]
      summary: Verify a TOTP code or a recovery code
      description: Activates a pending factor, elevates the session and rotates its tokens. Failures count towards a lockout.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
            description: Factor id.,
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, pattern: '^[0-9]{6}$' }
                recoveryCode: { type: string }
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema:
                type: object
                required: [mfaLevel, activated]
                properties:
                  mfaLevel: { type: string, enum: [totp, recovery] }
                  activated: { type: boolean }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /v1/auth/mfa/factors/{id}:
    delete:
      operationId: removeMfaFactor
      tags: [auth]
      summary: Remove an MFA factor (step-up required)
      description: Needs a recent MFA verification. Platform users cannot remove their last active factor.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
            description: Factor id.,
          }
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/auth/mfa/recovery-codes:
    post:
      operationId: generateRecoveryCodes
      tags: [auth]
      summary: Generate 10 single-use recovery codes (step-up required)
      description: Shown once; invalidates any previous batch. Requires an active factor.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '201':
          description: Codes
          content:
            application/json:
              schema:
                type: object
                required: [codes]
                properties:
                  codes: { type: array, minItems: 10, maxItems: 10, items: { type: string } }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/organizations:
    post:
      operationId: createOrganization
      tags: [organizations]
      summary: Create an organization
      description: Create an organization.
      x-nuzm-access: any-authenticated
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrganization' }
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Generic' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listOrganizations
      tags: [organizations]
      summary: List the caller's organizations
      description: List the caller's organizations.
      x-nuzm-access: any-authenticated
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Generic' }
        '401': { $ref: '#/components/responses/Problem' }
  /v1/organizations/{orgId}:
    get:
      operationId: getOrganization
      tags: [organizations]
      summary: Get an organization
      description: Get an organization. Requires permission `org:read` in the active organization (path orgId or X-Nuzm-Org); a non-member receives 404.
      x-nuzm-permission: org:read
      x-nuzm-org-scoped: true
      security: [{ sessionCookie: [], csrfHeader: [] }, { apiKey: [] }]
      parameters:
        - {
            name: orgId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
            description: Organization id.,
          }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateOrganization
      tags: [organizations]
      summary: Update an organization
      description: Update an organization. Requires permission `org:update` in the active organization (path orgId or X-Nuzm-Org); a non-member receives 404. Requires If-Match with the current ETag.
      x-nuzm-permission: org:update
      x-nuzm-org-scoped: true
      security: [{ sessionCookie: [], csrfHeader: [] }, { apiKey: [] }]
      parameters:
        - {
            name: orgId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
            description: Organization id.,
          }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateOrganization' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /v1/organizations/{orgId}/members:
    get:
      operationId: listMembers
      tags: [members]
      summary: List members
      description: List members. Requires permission `member:read` in the active organization (path orgId or X-Nuzm-Org); a non-member receives 404.
      x-nuzm-permission: member:read
      x-nuzm-org-scoped: true
      security: [{ sessionCookie: [], csrfHeader: [] }, { apiKey: [] }]
      parameters:
        - {
            name: orgId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
            description: Organization id.,
          }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/organizations/{orgId}/members/{userId}:
    patch:
      operationId: changeMemberRole
      tags: [members]
      summary: Change a member's role
      description: Change a member's role. Requires permission `member:manage` in the active organization (path orgId or X-Nuzm-Org); a non-member receives 404. Requires a recent MFA verification (step-up). Requires If-Match with the current ETag.
      x-nuzm-permission: member:manage
      x-nuzm-org-scoped: true
      security: [{ sessionCookie: [], csrfHeader: [] }, { apiKey: [] }]
      parameters:
        - {
            name: orgId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
            description: Organization id.,
          }
        - {
            name: userId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
            description: Member user id.,
          }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeRole' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Generic' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: removeMember
      tags: [members]
      summary: Remove a member
      description: Remove a member. Requires permission `member:manage` in the active organization (path orgId or X-Nuzm-Org); a non-member receives 404.
      x-nuzm-permission: member:manage
      x-nuzm-org-scoped: true
      security: [{ sessionCookie: [], csrfHeader: [] }, { apiKey: [] }]
      parameters:
        - {
            name: orgId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
            description: Organization id.,
          }
        - {
            name: userId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
            description: Member user id.,
          }
      responses:
        '204': { description: Done }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/invitations:
    post:
      operationId: createInvitation
      tags: [invitations]
      summary: Invite a person by email
      description: Invite a person by email. Requires permission `member:invite` in the active organization (path orgId or X-Nuzm-Org); a non-member receives 404.
      x-nuzm-permission: member:invite
      x-nuzm-org-scoped: true
      security: [{ sessionCookie: [], csrfHeader: [] }, { apiKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgHeader' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInvitation' }
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listInvitations
      tags: [invitations]
      summary: List invitations
      description: List invitations. Requires permission `member:invite` in the active organization (path orgId or X-Nuzm-Org); a non-member receives 404.
      x-nuzm-permission: member:invite
      x-nuzm-org-scoped: true
      security: [{ sessionCookie: [], csrfHeader: [] }, { apiKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgHeader' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/invitations/{id}/acceptance:
    post:
      operationId: acceptInvitation
      tags: [invitations]
      summary: Accept an invitation with its token
      description: Accept an invitation with its token.
      x-nuzm-access: any-authenticated
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
            description: Resource id.,
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptInvitation' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Generic' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
  /v1/invitations/{id}:
    delete:
      operationId: revokeInvitation
      tags: [invitations]
      summary: Revoke an invitation
      description: Revoke an invitation. Requires permission `member:invite` in the active organization (path orgId or X-Nuzm-Org); a non-member receives 404.
      x-nuzm-permission: member:invite
      x-nuzm-org-scoped: true
      security: [{ sessionCookie: [], csrfHeader: [] }, { apiKey: [] }]
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
            description: Resource id.,
          }
        - { $ref: '#/components/parameters/OrgHeader' }
      responses:
        '204': { description: Done }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/roles:
    get:
      operationId: listRoles
      tags: [rbac]
      summary: List roles and their permissions
      description: List roles and their permissions.
      x-nuzm-access: any-authenticated
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Generic' }
        '401': { $ref: '#/components/responses/Problem' }
  /v1/permissions:
    get:
      operationId: listPermissions
      tags: [rbac]
      summary: List permissions
      description: List permissions.
      x-nuzm-access: any-authenticated
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Generic' }
        '401': { $ref: '#/components/responses/Problem' }
  /v1/workspaces:
    post:
      operationId: createWorkspace
      tags: [workspaces]
      summary: Create a workspace
      description: Create a workspace. Requires permission `workspace:create` in the active organization (path orgId or X-Nuzm-Org); a non-member receives 404.
      x-nuzm-permission: workspace:create
      x-nuzm-org-scoped: true
      security: [{ sessionCookie: [], csrfHeader: [] }, { apiKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgHeader' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkspace' }
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listWorkspaces
      tags: [workspaces]
      summary: List workspaces
      description: List workspaces. Requires permission `workspace:read` in the active organization (path orgId or X-Nuzm-Org); a non-member receives 404.
      x-nuzm-permission: workspace:read
      x-nuzm-org-scoped: true
      security: [{ sessionCookie: [], csrfHeader: [] }, { apiKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgHeader' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspacePage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/workspaces/{id}:
    get:
      operationId: getWorkspace
      tags: [workspaces]
      summary: Get a workspace
      description: Get a workspace. Requires permission `workspace:read` in the active organization (path orgId or X-Nuzm-Org); a non-member receives 404.
      x-nuzm-permission: workspace:read
      x-nuzm-org-scoped: true
      security: [{ sessionCookie: [], csrfHeader: [] }, { apiKey: [] }]
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
            description: Resource id.,
          }
        - { $ref: '#/components/parameters/OrgHeader' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Generic' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
