    KnowledgeFilePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeFile'
        nextCursor:
          type: string
          nullable: true
    KnowledgeReviewEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        decision: { type: string, enum: [APPROVE, REJECT] }
        reviewerId: { type: string, format: uuid }
        reason: { type: string, nullable: true }
        checklist: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    KnowledgeReviewBlocker:
      type: object
      properties:
        code:
          {
            type: string,
            enum:
              [
                state,
                not_analyzed,
                blocking_findings,
                license_not_allowed,
                rejected,
                approvals_missing,
              ],
          }
        detail: { type: string }
    KnowledgeReviewState:
      type: object
      properties:
        versionId: { type: string, format: uuid }
        resourceId: { type: string, format: uuid }
        state: { type: string }
        stateReason: { type: string, nullable: true }
        provenanceClass: { type: string, enum: [FIRST_PARTY, THIRD_PARTY] }
        uploadedBy: { type: string, format: uuid, nullable: true }
        analysisJobId: { type: string, format: uuid, nullable: true }
        licenseProposal:
          type: object
          nullable: true
          additionalProperties: true
        licenseVerdict: { type: string, enum: [ALLOWED, RESTRICTED, UNKNOWN, BLOCKED] }
        summary:
          type: object
          nullable: true
          additionalProperties: true
        findings:
          type: object
          properties:
            info: { type: integer }
            warn: { type: integer }
            block: { type: integer }
        requiredApprovals: { type: integer }
        approvals:
          type: array
          items: { type: string, format: uuid }
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeReviewEntry'
        blockers:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeReviewBlocker'
        canActivate: { type: boolean }
        you:
          type: object
          properties:
            canReview: { type: boolean }
            hasApproved: { type: boolean }
            isUploader: { type: boolean }
    KnowledgeReviewInput:
      type: object
      required: [versionId, decision]
      properties:
        versionId: { type: string, format: uuid }
        decision: { type: string, enum: [approve, reject] }
        note: { type: string, maxLength: 2000 }
        checklist:
          type: object
          properties:
            findingsReviewed: { type: boolean }
            licenseReviewed: { type: boolean }
    KnowledgeActivationInput:
      type: object
      required: [versionId]
      properties:
        versionId: { type: string, format: uuid }
        note: { type: string, maxLength: 500 }
    KnowledgeManifestDetail:
      type: object
      required: [versionId, schemaVersion, createdAt, manifest]
      properties:
        versionId: { type: string, format: uuid }
        schemaVersion: { type: string, nullable: true }
        createdAt: { type: string, format: date-time, nullable: true }
        manifest:
          type: object
          nullable: true
          additionalProperties: true
          description: ProjectManifest (schemaVersion 1); see docs/spec-change-requests/SCR-K-03-project-detection.md for the shape.
    KnowledgeComponent:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string }
        framework: { type: string, nullable: true }
        path: { type: string }
        props:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              type: { type: string, nullable: true }
              required: { type: boolean }
        dependencies: { type: array, items: { type: string } }
        styleDeps: { type: array, items: { type: string } }
        assets: { type: array, items: { type: string } }
        platforms: { type: array, items: { type: string } }
        reuseAllowed: { type: boolean }
    KnowledgeComponentPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeComponent'
        nextCursor:
          type: string
          nullable: true
    KnowledgeRelationship:
      type: object
      properties:
        id: { type: string, format: uuid }
        fromKind: { type: string }
        fromRef: { type: string }
        toKind: { type: string }
        toRef: { type: string }
        relation: { type: string }
        evidence:
          type: object
          properties:
            path: { type: string }
            line: { type: integer }
    KnowledgeRelationshipPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeRelationship'
        nextCursor:
          type: string
          nullable: true
