                QUOTED,
                AWAITING_PAYMENT,
                PROVISIONING,
                ACTIVE,
                FAILED,
                DELETING,
                DELETED,
                UNKNOWN,
              ],
          }
        dataRegion: { type: string }
        country: { type: string }
        providerRegionId: { type: string }
        driftState: { type: string, enum: [in_sync, drift, orphan_suspected, missing] }
        lastSeenAt: { type: string, format: date-time, nullable: true }
        caseOpenedAt: { type: string, format: date-time, nullable: true }
        caseDetail: { type: object, additionalProperties: true, nullable: true }
        createdAt: { type: string, format: date-time }
    CloudResourceList:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CloudResource' } }
