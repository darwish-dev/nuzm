        '422': { $ref: '#/components/responses/Problem' }
components:
  parameters:
    OrgHeader:
      name: X-Nuzm-Org
      in: header
      required: false
      schema: { type: string, format: uuid }
      description: Active organization for session callers (verified against membership; API keys fix their own org).
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 255 }
      description: Makes the request safely retryable; same key plus same body replays the first response.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
      description: ETag of the version being modified; stale values return 412.
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      description: Page size.
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
      description: Opaque cursor from nextCursor.
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: Organization API key (nzk_…), scoped to a subset of its creator's permissions.
    sessionCookie:
      type: apiKey
      in: cookie
      name: nuzm_session
      description: Opaque server-side session (admin realm uses nuzm_admin_session).
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Double-submit CSRF token, required on unsafe methods with cookie auth.
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    PlanEntitlement:
      type: object
      required: [kind, mode]
      properties:
        kind: { type: string, enum: [meter_limit, feature] }
        meterGroup: { type: [string, 'null'] }
        featureKey: { type: [string, 'null'] }
        limit: { type: [string, 'null'], description: 'Integer string' }
        allowance: { type: [string, 'null'], description: 'Integer string' }
        mode: { type: string, enum: [soft, hard] }
        enabled: { type: boolean }
    Plan:
      type: object
      required: [id, key, name, placeholder, version, entitlements]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name:
          type: object
          required: [ar, en]
          properties:
            ar: { type: string }
            en: { type: string }
        placeholder: { type: boolean, description: 'true = DRAFT-NOT-APPROVED seed (HG-02-01)' }
        version:
          type: object
          required: [id, version, currency]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer }
            currency: { type: string }
            publishedAt: { type: [string, 'null'], format: date-time }
        entitlements: { type: array, items: { $ref: '#/components/schemas/PlanEntitlement' } }
        price:
          {
            type: [object, 'null'],
            description: 'Resolved from the price book (S06); null until then.',
          }
    PlanPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Plan' } }
        nextCursor: { type: [string, 'null'] }
    EffectiveEntitlements:
      type: object
      required: [plan, features, limits, marketplace]
      properties:
        plan:
          type: object
          required: [key, versionId, source]
          properties:
            key: { type: string }
            versionId: { type: string, format: uuid }
            source: { type: string, enum: [assignment, default] }
        features:
          type: object
          additionalProperties:
            type: object
            required: [enabled, source]
            properties:
              enabled: { type: boolean }
              source: { type: string, enum: [plan, override] }
        limits:
          type: array
          items:
            type: object
            required: [meterGroup, mode, source]
            properties:
              meterGroup: { type: string }
              limit: { type: [string, 'null'] }
              allowance: { type: [string, 'null'] }
              mode: { type: string, enum: [soft, hard] }
              source: { type: string, enum: [plan, override] }
        marketplace: { type: array, items: {}, description: 'Placeholder until M11.' }
    LedgerLine:
      type: object
      required:
        [
          id,
          transactionId,
          occurredAt,
          kind,
          description,
          direction,
          amountMinor,
          currency,
          balanceMinor,
        ]
      properties:
        id: { type: string, format: uuid }
        transactionId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        kind: { type: string }
        description: { type: string }
        direction: { type: string, enum: [debit, credit] }
        amountMinor: { type: string, description: 'Integer minor units' }
        currency: { type: string }
        balanceMinor: { type: string, description: 'Running wallet balance after this line' }
        reference: { type: [string, 'null'] }
    LedgerPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/LedgerLine' } }
        nextCursor: { type: [string, 'null'] }
    Balance:
      type: object
      required: [balances]
      properties:
        balances:
          type: array
          items:
            type: object
            required: [currency, balanceMinor]
            properties:
              currency: { type: string }
              balanceMinor: { type: string }
    AdminLedgerAccount:
      type: object
      required: [id, code, name, type, normalSide, currency, balanceMinor]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        type: { type: string }
        normalSide: { type: string, enum: [debit, credit] }
        orgId: { type: [string, 'null'], format: uuid }
        subledgerKey: { type: [string, 'null'] }
        currency: { type: string }
        balanceMinor: { type: string }
    AdminLedgerAccountPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminLedgerAccount' } }
        nextCursor: { type: [string, 'null'] }
    AdminLedgerTransaction:
      type: object
      required: [id, kind, description, occurredAt, postings]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: [string, 'null'], format: uuid }
        kind: { type: string }
        description: { type: string }
        idempotencyKey: { type: string }
        reversesId: { type: [string, 'null'], format: uuid }
        occurredAt: { type: string, format: date-time }
        postings:
          type: array
          items:
            type: object
            required: [accountCode, direction, amountMinor, currency]
            properties:
              accountCode: { type: string }
              direction: { type: string, enum: [debit, credit] }
              amountMinor: { type: string }
              currency: { type: string }
              dimensions: { type: object, additionalProperties: true }
    AdminLedgerTransactionPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminLedgerTransaction' } }
        nextCursor: { type: [string, 'null'] }
    PlanWrite:
      type: object
      properties:
        key: { type: string }
        name:
          type: object
          properties:
            ar: { type: string }
            en: { type: string }
        currency: { type: string }
        entitlements: { type: array, items: { $ref: '#/components/schemas/PlanEntitlement' } }
        action: { type: string, enum: [publish, new_draft] }
    AdminPlan:
      type: object
      required: [id, key, name, status, placeholder, versions]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name:
          type: object
          properties:
            ar: { type: string }
            en: { type: string }
        status: { type: string }
        placeholder: { type: boolean }
        versions:
          type: array
          items:
            type: object
            required: [id, version, status, entitlements]
            properties:
              id: { type: string, format: uuid }
              version: { type: integer }
              status: { type: string, enum: [draft, published] }
              currency: { type: string }
              publishedAt: { type: [string, 'null'] }
              entitlements: { type: array, items: { $ref: '#/components/schemas/PlanEntitlement' } }
    AdminPlanPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminPlan' } }
        nextCursor: { type: [string, 'null'] }
    Organization:
      type: object
      required:
        [id, name, slug, type, country, defaultLocale, status, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        type: { type: string, enum: [customer, agency, reseller] }
        country: { type: string }
        defaultLocale: { type: string, enum: [ar, en] }
        status: { type: string, enum: [active, suspended] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer }
    Invitation:
      type: object
      required: [id, email, role, expiresAt, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { type: string }
        expiresAt: { type: string, format: date-time }
        status: { type: string, enum: [pending, accepted, revoked, expired] }
        createdAt: { type: string, format: date-time }
    InvitationPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Invitation' } }
        nextCursor: { type: [string, 'null'] }
    ApiKey:
      type: object
      required: [id, name, prefix, scopes]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
