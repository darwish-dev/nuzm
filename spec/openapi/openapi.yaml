          detectedAt,
          linkedIncidentId,
          assessment,
          decision,
          timeline,
          timers,
          version,
          createdBy,
          createdAt,
          updatedAt,
          closedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        severity: { type: string, enum: [low, medium, high, critical] }
        state:
          {
            type: string,
            enum:
              [detected, triaged, assessed, notification_decision, notified, remediation, closed],
          }
        summary: { type: string }
        detectedAt: { type: string, format: date-time }
        linkedIncidentId: { type: [string, 'null'] }
        assessment: { type: [object, 'null'], additionalProperties: true }
        decision: { type: [object, 'null'], additionalProperties: true }
        timeline: { type: array, items: { type: object, additionalProperties: true } }
        timers:
          type: object
          required: [triageDueAt, assessDueAt, decisionDueAt, current]
          properties:
            triageDueAt: { type: string, format: date-time }
            assessDueAt: { type: string, format: date-time }
            decisionDueAt: { type: string, format: date-time }
            current:
              oneOf:
                - { type: 'null' }
                - type: object
                  required: [step, dueAt, overdue]
                  properties:
                    {
                      step: { type: string, enum: [triage, assess, decision] },
                      dueAt: { type: string, format: date-time },
                      overdue: { type: boolean },
                    }
        version: { type: integer }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        closedAt: { type: [string, 'null'], format: date-time }
        evidencePack: { type: object, additionalProperties: true }
