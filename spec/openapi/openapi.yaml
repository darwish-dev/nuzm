          type: object
          required:
            [
              effect,
              prorationMode,
              currency,
              oldAmountPerPeriodMinor,
              newAmountPerPeriodMinor,
              daysLeft,
              daysTotal,
              unusedCreditMinor,
              newChargeMinor,
              netMinor,
              effectiveDate,
            ]
          properties:
            effect: { type: string, enum: [charge, credit, none] }
            prorationMode: { type: string, enum: [prorate, none] }
            currency: { type: string }
            oldAmountPerPeriodMinor: { type: string }
            newAmountPerPeriodMinor: { type: string }
            daysLeft: { type: [integer, 'null'] }
            daysTotal: { type: [integer, 'null'] }
            unusedCreditMinor: { type: string }
            newChargeMinor: { type: string }
            netMinor:
              {
                type: string,
                description: 'Positive: invoiced now (tax added on the invoice). Negative: credited against the next renewal.',
