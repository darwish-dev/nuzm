            in: query,
            schema: { type: string, enum: [placeholder, draft, reviewed] },
          }
        - { name: history, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RopaPage' }
