      parameters:
        - { $ref: '#/components/parameters/OrgHeader' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWalletTopup' }
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletTopup' }
        '202':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletTopup' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/admin/billing/refunds:
    get:
      operationId: adminListRefunds
      tags: [payments]
      summary: List refunds across organizations
      description: 'S12d (UI-M03-15). Refunds newest first with their status, so finance can follow a pending refund. Filters: org, status (pending, succeeded, failed), paymentId. Platform permission `admin:billing:read`; admin-realm session; the read is audited (`billing.admin.refunds.read`). Read-only: a refund is still created only by POST.'
      x-nuzm-platform-permission: admin:billing:read
      x-nuzm-realm: admin
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: org, in: query, schema: { type: string, format: uuid } }
        - { name: paymentId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [pending, succeeded, failed] } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminRefundPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    post:
      operationId: adminCreateRefund
      tags: [payments]
      summary: Refund a captured payment
      description: 'Body {paymentId, amount (minor units), reason, creditNoteId?}. Permission admin:billing:manage; admin-realm session with MFA and step-up; needs Idempotency-Key (a replay returns the same refund). The amount may not exceed what is still refundable (captured minus refunded minus pending refunds), else 422. 201 when the refund finished, 202 while the PSP has not finished it (the platform keeps asking, and never sends it twice). The ledger entry (receivable or unapplied payment to PSP clearing) is made once per refund. A linked credit note becomes `refunded` when the refunds against it cover its total. Wallet top-up payments cannot be refunded yet.'
      x-nuzm-platform-permission: admin:billing:read
      x-nuzm-realm: admin
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - {
            name: Idempotency-Key,
            in: header,
            required: true,
            schema: { type: string, minLength: 1, maxLength: 255 },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRefund' }
      responses:
        '200':
          description: Idempotent replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '201':
          description: Refund finished
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '202':
          description: Refund accepted, the PSP has not finished it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/admin/billing/invoices:
    get:
      operationId: adminListInvoices
      tags: [billing]
      summary: Search invoices across organizations
      description: 'S12d (UI-M03-13). Invoices newest first with the e-invoice state of each. Filters: org, status, number (prefix of the invoice number), einvoiceState (not_generated or a submission state), from/to (issue date). Platform permission `admin:billing:read`; admin-realm session; the read is audited (`billing.admin.invoices.read`). Read-only: a wrong invoice is corrected by a credit note, never edited.'
      x-nuzm-platform-permission: admin:billing:read
      x-nuzm-realm: admin
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: org, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string } }
        - { name: number, in: query, schema: { type: string, maxLength: 40 } }
        - { name: einvoiceState, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminInvoicePage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/admin/billing/payments:
    get:
      operationId: adminListPayments
      tags: [payments]
      summary: List payments across organizations
      description: 'S12d (UI-M03-14). Payment attempts (intents) newest first. Filters: org, status, invoiceId, from/to (creation time). Platform permission `admin:billing:read`; admin-realm session; the read is audited (`billing.admin.payments.read`). No card data exists in the platform, so none is returned.'
      x-nuzm-platform-permission: admin:billing:read
      x-nuzm-realm: admin
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: org, in: query, schema: { type: string, format: uuid } }
        - { name: invoiceId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPaymentPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/admin/billing/payments/{id}/events:
    get:
      operationId: adminListPaymentEvents
      tags: [payments]
      summary: PSP events of a payment (redacted)
      description: 'S12d (UI-M03-14). The provider events stored for one payment, oldest first, with how each was handled and how many times the provider resent it (`duplicateCount`; a resend never has a second effect). The payload is the sanitized whitelist stored at intake with the provider payment reference masked to its last four characters. Platform permission `admin:billing:read`; the read is audited (`billing.admin.payment_events.read`). 404 for an unknown payment.'
      x-nuzm-platform-permission: admin:billing:read
      x-nuzm-realm: admin
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPspEventList' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/webhooks/payments/{provider}:
    post:
      operationId: receivePaymentWebhook
      tags: [payments]
      summary: PSP webhook
      description: 'Provider callback, authenticated by the signature over the raw body and a replay window (no session). 200 once the event is durably stored (a duplicate event id is 200 with no effect), 401 invalid signature or replay, 404 unknown provider. Processing is transactional and idempotent: one ledger effect per business event.'
      security: []
      parameters:
        - {
            name: provider,
            in: path,
            required: true,
            schema: { type: string },
            description: Provider name.,
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookResult' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
components:
  parameters:
    OrgHeader:
      name: X-Nuzm-Org
      in: header
      required: false
      schema: { type: string, format: uuid }
      description: Active organization for session callers (verified against membership; API keys fix their own org).
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 255 }
      description: Makes the request safely retryable; same key plus same body replays the first response.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
      description: ETag of the version being modified; stale values return 412.
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      description: Page size.
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
      description: Opaque cursor from nextCursor.
  securitySchemes:
    sourceKey:
      type: http
      scheme: bearer
      description: Per-source metering service key (internal producers). Not a user credential.
    apiKey:
      type: http
      scheme: bearer
      description: Organization API key (nzk_…), scoped to a subset of its creator's permissions.
    sessionCookie:
      type: apiKey
      in: cookie
      name: nuzm_session
      description: Opaque server-side session (admin realm uses nuzm_admin_session).
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Double-submit CSRF token, required on unsafe methods with cookie auth.
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    CreatePaymentMethod:
      type: object
      required: [provider, setupToken]
      properties:
        provider: { type: string }
        setupToken:
          {
            type: string,
            description: 'Token produced by the PSP hosted fields. Never a card number.',
          }
    PaymentMethod:
      type: object
      required:
        [id, provider, brand, last4, expMonth, expYear, status, isDefault, expiring, createdAt]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        brand: { type: string }
        last4: { type: string }
        expMonth: { type: integer }
        expYear: { type: integer }
        status: { type: string, enum: [active, removed] }
        isDefault: { type: boolean }
        expiring: { type: boolean }
        createdAt: { type: string, format: date-time }
    PaymentMethodList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PaymentMethod' } }
    CreatePayment:
      type: object
      required: [returnUrl]
      description: Send exactly one of invoiceId or walletTopupId.
      properties:
        invoiceId: { type: string, format: uuid }
        walletTopupId: { type: string, format: uuid }
        paymentMethodId: { type: string, format: uuid }
        amount:
          {
            type: string,
            pattern: '^[1-9][0-9]{0,17}$',
            description: 'Minor units; default and maximum is what is still owed.',
          }
        returnUrl:
          {
            type: string,
            description: 'Where the customer returns after 3-D Secure; must be an allowed origin.',
          }
    Payment:
      type: object
      required:
        [
          id,
          invoiceId,
          walletTopupId,
          amountMinor,
          currency,
          status,
          paymentMethodId,
          nextAction,
          failureCode,
          capturedMinor,
          refundedMinor,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        invoiceId: { type: [string, 'null'], format: uuid }
        walletTopupId: { type: [string, 'null'], format: uuid }
        amountMinor: { type: string }
        currency: { type: string }
        status:
          {
            type: string,
            enum:
              [
                requires_method,
                requires_action,
                processing,
                succeeded,
                failed,
                cancelled,
                partially_refunded,
                refunded,
              ],
          }
        paymentMethodId: { type: [string, 'null'], format: uuid }
        nextAction:
          type: [object, 'null']
          properties:
            type: { type: string, enum: [redirect] }
            url: { type: string }
        failureCode: { type: [string, 'null'] }
        capturedMinor: { type: string }
        refundedMinor: { type: string }
        createdAt: { type: string, format: date-time }
    UpdateDunningCase:
      type: object
      required: [action, reason]
      properties:
        action: { type: string, enum: [hold, resume] }
        reason: { type: string, minLength: 1, maxLength: 500 }
    DunningCase:
      type: object
      required:
        [
          id,
          orgId,
          subscriptionId,
          invoiceId,
          stage,
          openedAt,
          daysOverdue,
          retriesDone,
          nextRetryInDays,
          hold,
          holdReason,
          closedAt,
          closedReason,
          policyVersion,
          version,
        ]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        subscriptionId: { type: string, format: uuid }
        invoiceId: { type: string, format: uuid }
        stage:
          {
            type: string,
            enum: [overdue, reminder_1, reminder_2, restricted, suspended, terminated_pending],
          }
        openedAt: { type: string, format: date-time }
        daysOverdue: { type: integer }
        retriesDone: { type: integer }
        nextRetryInDays: { type: [integer, 'null'] }
        hold: { type: boolean }
        holdReason: { type: [string, 'null'] }
        closedAt: { type: [string, 'null'], format: date-time }
        closedReason: { type: [string, 'null'], enum: [paid, subscription_cancelled, null] }
        policyVersion: { type: integer }
        version: { type: integer }
    DunningCasePage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/DunningCase' } }
        nextCursor: { type: [string, 'null'] }
    ZatcaOnboardingWrite:
      type: object
      properties:
        environment: { type: string, enum: [sandbox, simulation] }
        step: { type: string, enum: [csr, compliance_csid, compliance_checks, production_csid] }
        stepId: { type: string, format: uuid }
        decision: { type: string, enum: [approve, reject] }
        otp:
          {
            type: string,
            maxLength: 20,
            description: 'One-time password from the portal; used once, never stored or logged.',
          }
    ZatcaOnboardingStep:
      type: object
      required:
        [id, environment, step, status, requestedBy, decidedBy, decidedAt, result, createdAt]
      properties:
        id: { type: string, format: uuid }
        environment: { type: string, enum: [sandbox, simulation] }
        step: { type: string, enum: [csr, compliance_csid, compliance_checks, production_csid] }
        status: { type: string, enum: [pending_approval, completed, failed, rejected] }
        requestedBy: { type: string, format: uuid }
        decidedBy: { type: [string, 'null'], format: uuid }
        decidedAt: { type: [string, 'null'], format: date-time }
        result:
          {
            type: object,
            additionalProperties: true,
            description: 'Public facts only (CSR, serial, check outcomes); never an OTP, secret or private key.',
          }
        createdAt: { type: string, format: date-time }
    ZatcaOnboardingView:
      type: object
      required: [environment, state, onboarded, notVerifiedVsZatca, credentials, steps]
      properties:
        environment: { type: string, enum: [sandbox, simulation] }
        state:
          {
            type: string,
            enum: [not_started, csr, compliance_csid, compliance_checks, production_csid],
          }
        onboarded: { type: boolean }
        notVerifiedVsZatca: { type: boolean }
        credentials:
          type: array
          items:
            type: object
            required: [kind, serial, expiresAt]
            properties:
              kind: { type: string }
              serial: { type: [string, 'null'] }
              expiresAt: { type: [string, 'null'], format: date-time }
        steps: { type: array, items: { $ref: '#/components/schemas/ZatcaOnboardingStep' } }
    ZatcaOnboardingList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ZatcaOnboardingView' } }
    ZatcaSubmission:
      type: object
      required:
        [
          id,
          documentId,
          orgId,
          environment,
          documentType,
          subtype,
          uuid,
          icv,
          state,
          attempt,
          deadLetter,
          nextAttemptAt,
          lastError,
          warnings,
          updatedAt,
          createdAt,
          windowRemainingSeconds,
          windowAlert,
          windowBreached,
          notVerifiedVsZatca,
        ]
      properties:
        id: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        environment: { type: string, enum: [sandbox, simulation] }
        documentType: { type: string }
        subtype: { type: string, enum: [standard, simplified] }
        uuid: { type: string, format: uuid }
        icv: { type: string }
        state:
          {
            type: string,
            enum: [generated, stamped, queued, submitted, cleared, reported, rejected, error],
          }
        attempt: { type: integer }
        deadLetter: { type: boolean }
        nextAttemptAt: { type: [string, 'null'], format: date-time }
        lastError:
          type: [object, 'null']
          properties:
            code: { type: string }
            message: { type: string }
        warnings:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              message: { type: string }
        updatedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        windowRemainingSeconds: { type: [integer, 'null'] }
        windowAlert: { type: boolean }
        windowBreached: { type: boolean }
        notVerifiedVsZatca: { type: boolean }
    ZatcaSubmissionPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ZatcaSubmission' } }
        nextCursor: { type: [string, 'null'] }
    RunReconciliations:
      type: object
      required: [types, periodFrom, periodTo]
      properties:
        types:
          {
            type: array,
            minItems: 1,
            maxItems: 6,
            uniqueItems: true,
            items: { type: string, enum: [RC-01, RC-02, RC-03, RC-04, RC-05, RC-06] },
          }
        periodFrom: { type: string, format: date }
        periodTo: { type: string, format: date }
    ReconciliationRun:
      type: object
      required:
        [
          id,
          type,
          periodFrom,
          periodTo,
          status,
          trigger,
          itemsChecked,
          breaksCount,
          openBreaks,
          summary,
          error,
          createdAt,
          startedAt,
          completedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [RC-01, RC-02, RC-03, RC-04, RC-05, RC-06] }
        periodFrom: { type: string, format: date }
        periodTo: { type: string, format: date }
        status: { type: string, enum: [queued, running, completed, failed] }
        trigger: { type: string, enum: [manual, scheduled] }
        itemsChecked: { type: integer }
        breaksCount: { type: integer }
        openBreaks: { type: integer }
        summary: { type: object, additionalProperties: true }
        error: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
    ReconciliationRunPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ReconciliationRun' } }
        nextCursor: { type: [string, 'null'] }
    RunReconciliationsAccepted:
      type: object
      required: [runs]
      properties:
        runs: { type: array, items: { $ref: '#/components/schemas/ReconciliationRun' } }
    ReconciliationItem:
      type: object
      required:
        [
          id,
          runId,
          type,
          matchKey,
          kind,
          relatedOrg,
          details,
          status,
          assignedTo,
          assignedAt,
          resolvedAt,
          overSla,
          createdAt,
          resolutions,
        ]
      properties:
        id: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        type: { type: string, enum: [RC-01, RC-02, RC-03, RC-04, RC-05, RC-06] }
        matchKey: { type: string }
        kind:
          {
            type: string,
            description: 'The kind of break, e.g. missing_settlement, receivable_mismatch, unbilled_usage, projection_drift, no_einvoice.',
          }
        relatedOrg: { type: [string, 'null'], format: uuid }
        details: { type: object, additionalProperties: true }
        status: { type: string, enum: [open, assigned, resolved] }
        assignedTo: { type: [string, 'null'], format: uuid }
        assignedAt: { type: [string, 'null'], format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }
        overSla: { type: boolean }
        createdAt: { type: string, format: date-time }
        resolutions:
          type: array
          items:
            type: object
            required: [id, action, adjustmentId, note, createdBy, createdAt]
            properties:
              id: { type: string, format: uuid }
              action: { type: string, enum: [assign, adjustment, accept] }
              adjustmentId: { type: [string, 'null'], format: uuid }
              note: { type: [string, 'null'] }
              createdBy: { type: string, format: uuid }
              createdAt: { type: string, format: date-time }
    ReconciliationRunDetail:
      type: object
      required: [run, items, itemsTruncated]
      properties:
        run: { $ref: '#/components/schemas/ReconciliationRun' }
        items: { type: array, items: { $ref: '#/components/schemas/ReconciliationItem' } }
        itemsTruncated: { type: boolean }
    ResolveBreak:
      type: object
      required: [itemId, action]
      properties:
        itemId: { type: string, format: uuid }
        action: { type: string, enum: [assign, adjustment, accept] }
        adjustmentId: { type: string, format: uuid }
        note: { type: string, minLength: 1, maxLength: 500 }
    FinanceReport:
      type: object
      required: [report, from, to, generatedAt, columns, rows, totals, notes]
      properties:
        report:
          { type: string, enum: [revenue, mrr, ar_aging, vat, margin, refunds, dunning, wallet] }
        from: { type: string, format: date }
        to: { type: string, format: date }
        generatedAt: { type: string, format: date-time }
        columns:
          type: array
          items:
            type: object
            required: [key, label, kind]
            properties:
              key: { type: string }
              label: { type: string }
              kind: { type: string, enum: [text, money, int] }
        rows: { type: array, items: { type: object, additionalProperties: true } }
        totals: { type: object, additionalProperties: true }
        notes: { type: array, items: { type: string } }
    CreateSubscription:
      type: object
      required: [planVersionId, paymentMethodId]
      properties:
        planVersionId: { type: string, format: uuid }
        paymentMethodId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 1000 }
    UpdateSubscription:
      type: object
      properties:
        planVersionId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 1000 }
        paymentMethodId: { type: string, format: uuid }
