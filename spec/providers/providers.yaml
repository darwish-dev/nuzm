# Provider registry seed + egress allow-list (M05 S16). Loaded by the cloud module; migration 0600 seeds the same keys.
# NOTHING here asserts what a vendor offers: regions, plans, prices and capabilities come ONLY from probes (docs/09 §1, FR-CLD-02).
# `egress.hosts` for real vendors is intentionally EMPTY until the adapter is implemented from the official documentation
# (S18-S22, citing the page and the date read); an adapter with an empty allow-list cannot make any outbound call.
status: PROPOSAL
providers:
  - key: mock
    kind: compute
    adapter: mock-compute
    environment_policy: non_production_only # a fixture adapter: never offered, never resolved, in a production profile
    egress: { hosts: [], allow_loopback: false }
    note: 'In-process simulator (packages/adapters/mock-compute). Makes no network calls. Evidence kind is always `mock`.'
  - key: alibaba
    kind: compute
    adapter: alibaba-ecs
    environment_policy: any
    egress: { hosts: [], allow_loopback: false }
    note: 'Adapter arrives in S18/S19 (needs HG-05-01). No Saudi-region assumption: offers appear only if a live probe lists the region.'
  - key: huawei
    kind: compute
    adapter: huawei-ecs
    environment_policy: any
    egress: { hosts: [], allow_loopback: false }
    note: 'Adapter arrives in S20/S21 (needs HG-05-02).'
  - key: contabo
    kind: compute
    adapter: contabo-vps
    environment_policy: any
    egress: { hosts: [], allow_loopback: false }
    note: 'Adapter arrives in S22 (needs HG-05-03). Per-account, per-plan capability detection.'
  - key: cloudpanel
    kind: hosting
    adapter: cloudpanel-node
    environment_policy: any
    egress: { hosts: [], allow_loopback: false }
    note: 'Registered for M06; no adapter in M05.'
